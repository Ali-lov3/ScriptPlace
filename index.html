<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScriptPlace</title>
<link rel="icon" type="image/png" href="https://cdn.discordapp.com/attachments/1455257373458432186/1558479033614999672/123.png?ex=6acb9634&amp;is=6aca44b4&amp;hm=982e869b9aea6e6e916226dcaae6f171dcd0afbb6fad09fcbcac9b31e3129bfb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--s1:#111113;--s2:#17171a;--s3:#212125;--line:#232327;--line2:#2f2f35;--text:#ededf0;--mut:#8b8b95;--pink:#ff3d8b;--pinkd:#e02a76;--bad:#f0506a;--good:#3ecf8e;--r:8px;--rl:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
button,a,.game,.chip{-webkit-touch-callout:none;touch-action:manipulation}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14.5px;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.hidden{display:none!important}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 24px;background:rgba(10,10,11,.96);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:17px;letter-spacing:-.02em;margin-right:auto}
.logo img{height:30px;width:auto;display:block}
.tools{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--mut);transition:background .12s,border-color .12s,color .12s;overflow:hidden}
.ib:hover{background:var(--s2);border-color:var(--line2);color:var(--text)}
.ib svg{width:18px;height:18px}
.ib img{width:100%;height:100%;object-fit:cover}
.ib.open{border-color:var(--pink);color:var(--text)}
.ib .i-close{display:none}
.ib.open .i-close{display:block}
.ib.open .i-open{display:none}
.bw{position:relative;display:inline-flex}
.nb{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--pink);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);pointer-events:none;line-height:1}

.menu,.npanel{position:absolute;right:20px;top:62px;background:var(--s1);border:1px solid var(--line2);border-radius:var(--rl);box-shadow:0 16px 40px rgba(0,0,0,.6);animation:mIn .12s ease-out;transform-origin:top right}
.menu{width:min(280px,calc(100vw - 24px));padding:6px;display:grid;gap:2px}
.npanel{width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;padding:6px}
@keyframes mIn{from{opacity:0;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.menu,.npanel,.mo,.md{animation:none}}
.mhead{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r);text-decoration:none;margin-bottom:4px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.mhead:hover{background:var(--s2)}
.mhead .mt{min-width:0;display:grid}
.mhead .mt b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead .mt small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mi{display:flex;align-items:center;gap:10px;text-decoration:none;padding:9px 10px;border-radius:var(--r);font-weight:500;font-size:14px;color:var(--mut)}
.menu .mi svg{width:18px;height:18px;flex:0 0 auto}
.menu .mi:hover{background:var(--s2);color:var(--text)}
.menu .mi.on{background:var(--s2);color:var(--text)}
.menu .mi.on svg{color:var(--pink)}
.menu .pub{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px;padding:10px;border-radius:var(--r);background:var(--pink);color:#fff;font-weight:600;font-size:14px;text-decoration:none}
.menu .pub svg{width:16px;height:16px}
.menu .pub:hover{background:var(--pinkd)}
.mout{margin-top:2px;padding:9px;text-align:center;color:var(--mut);font-weight:500;font-size:13.5px;border-radius:var(--r)}
.mout:hover{color:var(--bad);background:var(--s2)}
.av svg{width:18px;height:18px}

.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.note{border:1px solid var(--line2);border-left:3px solid var(--pink);background:var(--s1);padding:10px 14px;font-size:13px;color:var(--mut);border-radius:var(--r);margin-bottom:18px}

.sbw{position:relative}
.sb{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:4px 4px 4px 14px;transition:border-color .12s}
.sb:focus-within{border-color:var(--pink)}
.sb svg{width:18px;height:18px;color:var(--mut);flex:0 0 auto}
.sb input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:15px;padding:10px 0;outline:none;border-radius:0}
.sb input:focus{border:0}
.sb input::placeholder{color:var(--mut)}
.sb .btn{padding:9px 18px}
.sdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:25;background:var(--s1);border:1px solid var(--line2);border-radius:var(--rl);padding:10px;box-shadow:0 16px 40px rgba(0,0,0,.6);max-height:60vh;overflow:auto;display:grid;gap:4px}
.sdrop .sl{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:8px 6px 4px}
.sdrop .chips{padding:0 2px 4px}
.sg{display:flex;align-items:center;gap:12px;padding:7px 8px;border-radius:var(--r);text-align:left;width:100%}
.sg:hover{background:var(--s2)}
.sg img,.sg .ph{width:36px;height:36px;border-radius:7px;object-fit:cover;background:var(--s3);flex:0 0 auto}
.sg span{min-width:0;display:grid}
.sg b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.all{color:var(--pink);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);margin-top:4px;padding-top:11px}

.rowh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rowh h2{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.rowh h2 svg{width:18px;height:18px;color:var(--pink)}
.rowh.big{margin-top:32px}
.rowh h1{margin:0;font-size:26px;letter-spacing:-.025em;font-weight:700;line-height:1.15}
.hot{margin-top:28px}
.lnk{color:var(--mut);font-size:13.5px;font-weight:500}
.lnk:hover{color:var(--text)}
.hg{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.hg::-webkit-scrollbar{display:none}
.hg .g{flex:0 0 auto;display:flex;align-items:center;gap:12px;min-width:190px;padding:8px 14px 8px 8px;background:var(--s1);border:1px solid var(--line);border-radius:10px;text-align:left;transition:border-color .12s}
.hg .g:hover{border-color:var(--line2)}
.hg .g.on{border-color:var(--pink)}
.hg .g img,.hg .g .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--s3)}
.hg .g b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.hg .g small{color:var(--mut);font-size:12px}
.fs{display:flex;align-items:center;gap:8px;padding:8px 14px;font-weight:500;font-size:14px}
.fs svg{width:16px;height:16px}
.btn.fs{display:inline-flex;align-items:center;gap:8px}
.fs .fcount{background:var(--pink);color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.fs .chev{transition:transform .15s}
.fs.open .chev{transform:rotate(180deg)}
.intro{color:var(--mut);font-size:15px;line-height:1.7;max-width:760px;margin:14px 0 16px}
.intro u{text-decoration:none;color:var(--text);font-weight:500}
.intro .lnk{font-size:inherit;color:var(--text);text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:2px;text-underline-offset:4px;font-weight:500}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);user-select:none;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--line2);background:var(--s3)}
.chip.on{background:rgba(255,61,139,.12);border-color:var(--pink);color:var(--pink)}
.chip.rm svg{width:11px;height:11px}
#active:not(:empty){margin-top:14px}

.feed{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:20px}
.sc{background:var(--s1);border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:border-color .12s,transform .12s}
a.sc:hover{border-color:var(--line2);transform:translateY(-2px)}
.sc .th{aspect-ratio:16/10;background:var(--s3) center/cover no-repeat;position:relative}
.sc .vw,.sc .ago{position:absolute;top:10px;background:rgba(10,10,11,.85);padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.sc .vw{left:10px}
.sc .ago{right:10px;font-weight:500;color:var(--mut)}
.sc .vw svg{width:13px;height:13px}
.sc .bd{padding:14px;display:flex;flex-direction:column;gap:3px;flex:1}
.sc .gn{font-size:12px;color:var(--pink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;letter-spacing:-.01em}
.sc .by{color:var(--mut);font-size:12.5px}
.sc .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:5px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.badge.k{background:rgba(255,61,139,.1);border-color:rgba(255,61,139,.25);color:var(--pink)}
.badge.f{background:rgba(62,207,142,.08);border-color:rgba(62,207,142,.22);color:var(--good)}
.badge.p{background:rgba(245,184,75,.1);border-color:rgba(245,184,75,.25);color:#f5b84b}
.badge.x{background:var(--s3);border-color:var(--line2);color:var(--text)}
.owner{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--pink);color:#fff;vertical-align:middle;line-height:1.6}

.ulink{cursor:pointer}
.ulink:hover{color:var(--pink);text-decoration:underline}
.uav{display:inline-flex;flex:0 0 auto}
.uav[data-u]{cursor:pointer}
.uav[data-u]:hover .av{filter:brightness(.85)}

.sk{border-radius:var(--rl);height:290px;background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:300% 100%;animation:sh 1.4s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-300% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}html{scroll-behavior:auto}}
.empty{text-align:center;color:var(--mut);padding:56px 12px}
.empty h3{color:var(--text);margin:0 0 6px;font-size:18px;font-weight:600}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--rl);padding:20px}
.card h2{margin:0 0 12px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.grid2{display:grid;gap:18px;grid-template-columns:1.25fr 1fr;align-items:start}
.grid2.eq{grid-template-columns:1fr 1fr}
@media(max-width:900px){.grid2,.grid2.eq{grid-template-columns:1fr}.rowh h1{font-size:23px}}
.step{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step i{font-style:normal;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:rgba(255,61,139,.12);color:var(--pink);font-weight:700;font-size:12.5px}
.step h2{margin:0}

label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 6px;font-weight:500}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:var(--r);padding:10px 12px;font:inherit;font-size:14px;outline:none;transition:border-color .12s}
input:focus,textarea:focus,select:focus{border-color:var(--pink)}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--pink)}
textarea{resize:vertical;min-height:120px;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:13px}

.btn{background:var(--pink);color:#fff;border-radius:var(--r);padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none;display:inline-block;transition:background .12s,border-color .12s;text-align:center;border:1px solid transparent}
.btn:hover{background:var(--pinkd)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--s2);border-color:var(--line2);color:var(--text)}
.btn.sec:hover{background:var(--s3);border-color:#3b3b42}
.btn.danger{background:transparent;border-color:rgba(240,80,106,.5);color:var(--bad)}
.btn.danger:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.btn{flex:0 0 auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.good{color:var(--good);font-size:13px;margin-top:8px}

.gsearch{position:relative}
.gsearch input{padding:11px 14px;font-size:15px}
.spin{position:absolute;right:14px;top:50%;width:16px;height:16px;margin-top:-8px;border:2px solid var(--line2);border-top-color:var(--pink);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.results{display:grid;gap:6px;margin-top:10px;max-height:340px;overflow:auto}
.game{display:flex;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg);transition:border-color .12s}
.game:hover{border-color:var(--pink)}
.game img{width:48px;height:48px;border-radius:8px;background:var(--s3);object-fit:cover}
.game b{display:block;font-size:14px;font-weight:600}
.game small{color:var(--mut)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugg .chip{font-size:12.5px;padding:5px 10px;cursor:pointer}
.sel{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--pink);border-radius:10px;background:var(--bg)}
.sel img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--s3)}
.sel .t{flex:1;min-width:0}
.sel b{font-size:16px;font-weight:600;display:block}

.dhero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.dhero img.ic{width:88px;height:88px;border-radius:14px;object-fit:cover;background:var(--s3)}
.dhero h1{margin:0;font-size:28px;letter-spacing:-.025em;line-height:1.15;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:12px}
.facts div small{display:block;color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.facts div b{font-size:14px;font-weight:600}
.code{background:#070708;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.code .bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--s1);font-size:12px;color:var(--mut);font-family:ui-monospace,"SF Mono",Consolas,monospace}
.code pre{margin:0;padding:14px;font-size:13px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,"SF Mono",Consolas,monospace;max-height:380px;overflow:auto;color:#d9d9de}

.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:10px;flex-wrap:wrap}
.item img{width:52px;height:52px;border-radius:8px;background:var(--s3);object-fit:cover}
.item .meta{flex:1;min-width:140px}
.item .meta b{display:block;font-weight:600}
.item .meta small{color:var(--mut)}
a.item{text-decoration:none;transition:border-color .12s}
a.item:hover{border-color:var(--pink)}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:30px;font-weight:700}
.mstats{display:flex;gap:32px;margin:16px 0 20px}
.mstats b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
.mstats span{color:var(--mut);font-size:12.5px}
.sticky{position:sticky;top:84px}
.join{padding:28px 0 6px}
.join h1{font-size:30px;margin:0 0 8px;letter-spacing:-.025em;font-weight:700}
.join p{color:var(--mut);margin:0 0 6px;max-width:520px}

.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;font-weight:700;color:#fff;flex:0 0 auto;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{display:inline-flex;align-items:center;gap:8px}

.fp{background:var(--s1);border:1px solid var(--line);border-radius:var(--rl);padding:18px 20px;margin-top:16px;display:grid;gap:18px}
.fgrp{display:grid;gap:8px}
.fl{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.seg2{display:inline-flex;justify-self:start;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:3px;max-width:100%;gap:2px}
.seg2 button{padding:6px 14px;border-radius:6px;font-weight:500;font-size:13.5px;color:var(--mut)}
.seg2 button:hover{color:var(--text)}
.seg2 button.on{background:var(--s3);color:var(--text)}
.fpfoot{display:flex;justify-content:flex-end}

.prof{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.pban{height:84px}
.pbody{display:grid;grid-template-columns:auto 1fr;gap:0 20px;align-items:end;padding:0 24px 22px}
#pAv{margin-top:-44px;border:4px solid var(--s1);border-radius:50%;display:flex}
.pinfo{padding-top:14px;min-width:0}
.pinfo h1{margin:0;font-size:24px;letter-spacing:-.025em;line-height:1.2;font-weight:700}
.pbio{margin:8px 0 0;color:#cfcfd6;max-width:520px;white-space:pre-wrap}
.pbio:empty{display:none}
.plink{display:inline-block;margin-top:10px;margin-right:14px;font-size:13.5px;font-weight:500;color:var(--pink);text-decoration:none}
.plink:hover{text-decoration:underline}
.pstats{grid-column:1/-1;display:flex;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.pstats div{flex:1}
.pstats div+div{padding-left:20px;border-left:1px solid var(--line)}
.pstats b{display:block;font-size:18px;font-weight:700}
.pstats span{color:var(--mut);font-size:12px}
@media(max-width:560px){.pstats div+div{padding-left:12px}.pstats b{font-size:16px}.pbody{padding:0 16px 18px}}
.avrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--s1)}
.swatches button.on{border-color:var(--text)}
.aved{display:flex;gap:16px;align-items:center;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.avbtn{position:relative;border-radius:50%;display:block;flex:0 0 auto}
.avbtn .cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--pink);display:grid;place-items:center;border:3px solid var(--bg)}
.avbtn .cam svg{width:13px;height:13px;color:#fff}
.avbtn:hover .av{filter:brightness(.8)}
.avtxt b{display:block;font-size:14px;font-weight:600}
.avtxt .hint{margin:2px 0 0}
.avact{display:flex;gap:16px;margin-top:10px}
.avact .lnk{font-weight:600;font-size:13.5px}
.avact .up{color:var(--pink)}
.avact .dn{color:var(--bad)}
.mysec{margin-top:36px}
.mysec .rowh{flex-wrap:wrap}

<script>
const CFG=window.SCRIPTPLACE_CONFIG,REMOTE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
const PROXY={games:'https://games.roproxy.com',apis:'https://apis.roproxy.com',thumbs:'https://thumbnails.roproxy.com'};

const SUGG=['Blox Fruits','Brookhaven','Adopt Me','Grow a Garden','Steal a Brainrot','Murder Mystery 2','Pet Simulator 99','Fisch','Arsenal','Doors'];

const ICON_TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

const ownerTag=id=>id===OWNER_ID?'<span class="owner">Owner</span>':'';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//i.test(u||'')?u:'';
const go=p=>{location.hash=p};
const getSess=()=>LS.get('spl_sess',null);
const fmt=n=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};
function timeAgo(d){
  if(!d)return 'just now';
  const s=(Date.now()-new Date(d).getTime())/1000;
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+'min ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<2592000)return Math.floor(s/86400)+'d ago';
  return new Date(d).toLocaleDateString('en-US');
}
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2600)}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function copy(t,label){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(label||'Copied to clipboard')}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function icons(ids){if(!ids.length)return{};try{const d=await getJSON(`${PROXY.thumbs}/v1/games/icons?universeIds=${ids.join(',')}&size=256x256&format=Png&isCircular=false`);const m={};d.data.forEach(x=>m[x.targetId]=x.imageUrl);return m}catch(e){return{}}}
const fresh=()=>({game:null,features:['Auto Farm'],title:'',description:'',code:'',link:'',access:'free',executors:[],editId:null,rules:false});
let draft=Object.assign(fresh(),LS.get('spl_draft',{}));
if(draft.key==='yes'&&draft.access==='free')draft.access='key';

const isUUID=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v||'');
const uAttr=id=>id&&(!REMOTE||isUUID(id))?` data-u="${esc(encodeURIComponent(id))}" role="link" tabindex="0"`:'';
const uLink=(id,name)=>uAttr(id)?`<span class="ulink"${uAttr(id)}>${esc(name)}</span>`:esc(name);

  const _s=getSess();if(_s&&!_s.token)LS.set('spl_sess',null);
  if(draft.editId&&!isUUID(draft.editId)){draft=fresh();saveDraft()}
  if(location.hash.startsWith('#script/')&&!isUUID(location.hash.slice(8)))location.hash='home';
}

async function rq(path,{method='GET',body,headers={},auth=true,retry=true}={}){
  const s=getSess();
  const h={apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json',Authorization:'Bearer '+((auth&&s&&s.token)||CFG.SUPABASE_ANON_KEY),...headers};
  const r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401&&retry&&auth&&s&&s.refresh&&await refreshTok())return rq(path,{method,body,headers,auth,retry:false});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.msg||j.message||j.error_description||j.error||m}catch(e){}throw new Error(m)}
  const t=await r.text();return t?JSON.parse(t):null;
}
async function refreshTok(){const s=getSess();try{const j=await rq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh},auth:false,retry:false});LS.set('spl_sess',{...s,token:j.access_token,refresh:j.refresh_token});return true}catch(e){LS.set('spl_sess',null);return false}}
const sessFrom=j=>{const m=j.user.user_metadata||{},em=j.user.email||'';return{id:j.user.id,email:em,username:String(m.username||(m.custom_claims&&m.custom_claims.global_name)||m.full_name||m.name||m.preferred_username||em.split('@')[0]||'user').slice(0,30),created:j.user.created_at,token:j.access_token,refresh:j.refresh_token}};

const Auth={
  async register(email,username,password){
    if(REMOTE){
      const j=await rq('/auth/v1/signup',{method:'POST',body:{email,password,data:{username}},auth:false});
      if(j&&j.access_token){LS.set('spl_sess',sessFrom(j));return 'ok'}
      return 'confirm';
    }
    const all=LS.get('spl_users',{}),k=email.toLowerCase();
    if(all[k])throw new Error('Email already registered');
    if(Object.values(all).some(u=>u.username.toLowerCase()===username.toLowerCase()))throw new Error('Username already taken');
    const salt=crypto.randomUUID();all[k]={email:k,username,salt,hash:await sha(salt+password),created:Date.now()};
    LS.set('spl_users',all);LS.set('spl_sess',{id:k,email:k,username,created:all[k].created});return 'ok';
  },
  async login(email,password){
    if(REMOTE){const j=await rq('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false});LS.set('spl_sess',sessFrom(j));return}
    const u=LS.get('spl_users',{})[email.toLowerCase()];
    if(!u||await sha(u.salt+password)!==u.hash)throw new Error('Wrong email or password');
    LS.set('spl_sess',{id:u.email,email:u.email,username:u.username,created:u.created});
  },
  discord(){location.href=CFG.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/authorize?provider=discord&redirect_to='+encodeURIComponent(location.origin+location.pathname)},
  logout(){LS.set('spl_sess',null)},
  async changePassword(oldP,newP){
    if(REMOTE){await rq('/auth/v1/user',{method:'PUT',body:{password:newP}});return}
    const s=getSess(),all=LS.get('spl_users',{}),u=all[s.id];
    if(await sha(u.salt+oldP)!==u.hash)throw new Error('Current password is wrong');
    u.salt=crypto.randomUUID();u.hash=await sha(u.salt+newP);LS.set('spl_users',all);
  }
};

const DB={
  async list({q='',sort='new',page=0,key='all',features=[],executor=''}){
    const hasF=features.length>0||!!executor;
    const match=x=>features.every(f=>(x.features||[]).includes(f))&&(!executor||(x.executors||[]).includes(executor));
    const keyOk=x=>key==='all'||(key==='no'&&!x.key_system&&!x.paid)||(key==='yes'&&!!x.key_system)||(key==='paid'&&!!x.paid);
    if(REMOTE){
      let p=`/rest/v1/scripts?select=id,user_id,title,game_name,icon,features,executors,key_system,paid,views,author,created_at&order=${sort==='top'?'views.desc':'created_at.desc'}`;
      p+=hasF?'&limit=400':`&limit=${PAGE+1}&offset=${page*PAGE}`;
      const c=q.replace(/[,()*%]/g,' ').trim();
      if(c)p+=`&or=(title.ilike.*${encodeURIComponent(c)}*,game_name.ilike.*${encodeURIComponent(c)}*)`;
      if(key==='no')p+='&key_system=eq.false&paid=eq.false';
      if(key==='yes')p+='&key_system=eq.true';
      if(key==='paid')p+='&paid=eq.true';
      let rows=await rq(p);
      if(hasF){rows=rows.filter(match);return{items:rows.slice(page*PAGE,page*PAGE+PAGE),more:rows.length>page*PAGE+PAGE}}
      return{items:rows.slice(0,PAGE),more:rows.length>PAGE};
    }
    let a=LS.get('spl_scripts',[]);const c=q.toLowerCase().trim();
    if(c)a=a.filter(x=>(x.title+' '+(x.game_name||'')).toLowerCase().includes(c));
    a=a.filter(keyOk);
    if(hasF)a=a.filter(match);
    a=[...a].sort((x,y)=>sort==='top'?(y.views||0)-(x.views||0):new Date(y.created_at)-new Date(x.created_at));
    return{items:a.slice(page*PAGE,page*PAGE+PAGE),more:a.length>page*PAGE+PAGE};
  },
  async stats(){
    const rows=REMOTE?await rq('/rest/v1/scripts?select=views,game_name,icon,key_system,paid&limit=1000'):LS.get('spl_scripts',[]);
    const games={};rows.forEach(r=>{if(!r.game_name)return;const g=games[r.game_name]||(games[r.game_name]={name:r.game_name,icon:r.icon,n:0});g.n++;});
    return{scripts:rows.length,views:rows.reduce((a,r)=>a+(r.views||0),0),keyless:rows.filter(r=>!r.key_system&&!r.paid).length,games:Object.keys(games).length,top:Object.values(games).sort((a,b)=>b.n-a.n).slice(0,12)};
  },
  async get(id){
    if(REMOTE){if(!isUUID(id))return null;const r=await rq(`/rest/v1/scripts?id=eq.${encodeURIComponent(id)}&select=*`);return r[0]||null}
    return LS.get('spl_scripts',[]).find(x=>x.id===id)||null;
  },
  async mine(){
    const s=getSess();if(!s)return[];
    if(REMOTE)return rq(`/rest/v1/scripts?user_id=eq.${encodeURIComponent(s.id)}&select=id,title,game_name,icon,features,executors,key_system,paid,views,created_at&order=created_at.desc`);
    return LS.get('spl_scripts',[]).filter(x=>x.user_id===s.id).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
  },
  async byUser(uid){
    if(REMOTE)return rq(`/rest/v1/scripts?user_id=eq.${encodeURIComponent(uid)}&select=id,user_id,title,game_name,icon,features,executors,key_system,paid,views,author,created_at&order=created_at.desc&limit=200`);
    return LS.get('spl_scripts',[]).filter(x=>x.user_id===uid).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
  },
  async save(item,id){
    const s=getSess();
    if(REMOTE){
      if(id&&!isUUID(id))throw new Error('This script is from an old demo session and cannot be edited.');
      if(id){const r=await rq(`/rest/v1/scripts?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:item,headers:{Prefer:'return=representation'}});if(!r||!r[0])throw new Error('Not allowed');return r[0]}
      const r=await rq('/rest/v1/scripts',{method:'POST',body:{...item,user_id:s.id,author:s.username},headers:{Prefer:'return=representation'}});return r[0];
    }
    const all=LS.get('spl_scripts',[]);
    if(id){const i=all.findIndex(x=>x.id===id&&x.user_id===s.id);if(i<0)throw new Error('Not allowed');all[i]={...all[i],...item};LS.set('spl_scripts',all);return all[i]}
    const n={...item,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),user_id:s.id,author:s.username,views:0,created_at:new Date().toISOString()};
    all.unshift(n);LS.set('spl_scripts',all);return n;
  },

  async notifs(){

    const mine=await DB.mine(),ids=mine.map(x=>x.id),titles={};

    if(REMOTE){
      const me=encodeURIComponent(s.id),list=ids.map(encodeURIComponent).join(',');
      [likes,coms,fol,myc]=await Promise.all([
        ids.length?rq(`/rest/v1/script_likes?script_id=in.(${list})&user_id=neq.${me}&select=script_id,user_id,author,created_at&order=created_at.desc&limit=50`):[],
        ids.length?rq(`/rest/v1/script_comments?script_id=in.(${list})&user_id=neq.${me}&select=id,script_id,user_id,author,body,created_at&order=created_at.desc&limit=50`):[],
        rq(`/rest/v1/follows?following_id=eq.${me}&select=follower_id,author,created_at&order=created_at.desc&limit=50`),
        rq(`/rest/v1/script_comments?user_id=eq.${me}&select=id,script_id,body&order=created_at.desc&limit=100`)
      ]);
      if(myc.length){
        const cids=myc.map(c=>encodeURIComponent(c.id)).join(',');
        [cl,reps]=await Promise.all([
          rq(`/rest/v1/comment_likes?comment_id=in.(${cids})&user_id=neq.${me}&select=comment_id,user_id,author,created_at&order=created_at.desc&limit=50`),
          rq(`/rest/v1/script_comments?parent_id=in.(${cids})&user_id=neq.${me}&select=id,script_id,user_id,author,body,created_at&order=created_at.desc&limit=50`)
        ]);
      }
    }else{
      const allC=LS.get('spl_comments',[]);
      likes=LS.get('spl_likemeta',[]).filter(l=>ids.includes(l.script_id)&&l.user_id!==s.id);
      coms=allC.filter(c=>ids.includes(c.script_id)&&c.user_id!==s.id);
      fol=LS.get('spl_follows',[]).filter(f=>f.following_id===s.id).map(f=>({follower_id:f.follower_id,author:f.author,created_at:f.created_at}));
      myc=allC.filter(c=>c.user_id===s.id);
      cl=LS.get('spl_clikes',[]).filter(l=>myc.some(c=>c.id===l.comment_id)&&l.user_id!==s.id);
      reps=allC.filter(c=>c.parent_id&&myc.some(m=>m.id===c.parent_id)&&c.user_id!==s.id);
    }
    const mc={};myc.forEach(c=>mc[c.id]=c);
    const cset=new Set(coms.map(c=>c.id));
    const out=[
      ...likes.map(l=>({type:'like',script_id:l.script_id,user_id:l.user_id,author:l.author||'Someone',created_at:l.created_at,title:titles[l.script_id]})),
      ...coms.map(c=>({type:'comment',script_id:c.script_id,user_id:c.user_id,author:c.author,body:c.body,created_at:c.created_at,title:titles[c.script_id]})),
      ...fol.map(f=>({type:'follow',user_id:f.follower_id,author:f.author||'Someone',created_at:f.created_at})),
      ...cl.map(l=>({type:'clike',script_id:(mc[l.comment_id]||{}).script_id,user_id:l.user_id,author:l.author||'Someone',body:(mc[l.comment_id]||{}).body,created_at:l.created_at})).filter(n=>n.script_id),
      ...reps.filter(r=>!cset.has(r.id)).map(r=>({type:'reply',script_id:r.script_id,user_id:r.user_id,author:r.author,body:r.body,created_at:r.created_at}))
    ];
    return out.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,40);
  },

function ask(title,text,label='Delete'){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='mo';
    o.innerHTML=`<div class="md" role="dialog" aria-modal="true"><div class="mic">${ICON_TRASH}</div><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="mbtn"><button type="button" class="btn sec" data-r="0">Cancel</button><button type="button" class="btn danger" data-r="1">${esc(label)}</button></div></div>`;
    const done=v=>{o.remove();res(v)};
    o.onclick=e=>{if(e.target===o)done(false)};
    o.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>done(b.dataset.r==='1'));
    document.body.appendChild(o);
    o.querySelector('[data-r="0"]').focus();
  });
}

  const applyQ=v=>{home.q=v;$('hQ').value=v;hideDrop();syncGames();homeLoad(true)};
  const bindDrop=()=>{
    drop.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>applyQ(b.dataset.q));
    drop.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{hideDrop();go('script/'+b.dataset.s)});
  };
  const showExamples=()=>{
    const games=(home.top.length?home.top.map(g=>g.name):SUGG).slice(0,8);
    const feats=['Auto Farm','Anti AFK','ESP','Infinite Jump','Teleport','Speed Boost','No key'];
    drop.innerHTML=`<div class="sl">Try searching for</div><div class="chips">${games.map(n=>`<button type="button" class="chip" data-q="${esc(n)}">${esc(n)}</button>`).join('')}</div><div class="sl">Popular keywords</div><div class="chips">${feats.map(n=>`<button type="button" class="chip" data-q="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
    drop.classList.remove('hidden');
    bindDrop();
  };
  const suggest=async v=>{
    const seq=++sSeq;
    try{
      const r=await DB.list({q:v,sort:'top',page:0});
      if(seq!==sSeq||document.activeElement!==$('hQ'))return;
      const seen=new Set(),games=[];
      r.items.forEach(it=>{if(it.game_name&&!seen.has(it.game_name)&&games.length<3){seen.add(it.game_name);games.push({name:it.game_name,icon:it.icon})}});
      const items=r.items.slice(0,5);
      const thumb=u=>safeUrl(u)?`<img src="${esc(safeUrl(u))}" alt="">`:'<span class="ph"></span>';
      let html='';
      if(games.length)html+=`<div class="sl">Games</div>${games.map(g=>`<button type="button" class="sg" data-q="${esc(g.name)}">${thumb(g.icon)}<span><b>${esc(g.name)}</b><small>Show all scripts for this game</small></span></button>`).join('')}`;
      if(items.length)html+=`<div class="sl">Scripts</div>${items.map(it=>`<button type="button" class="sg" data-s="${esc(it.id)}">${thumb(it.icon)}<span><b>${esc(it.title)}</b><small>${esc(it.game_name||'Universal')}, ${fmt(it.views)} views</small></span></button>`).join('')}`;
      if(!games.length&&!items.length)html+='<div class="sl">No suggestions</div>';
      html+=`<button type="button" class="sg all" data-q="${esc(v)}">Search for "${esc(v)}"</button>`;
      drop.innerHTML=html;
      drop.classList.remove('hidden');
      bindDrop();
    }catch(e){}
  };
  $('hQ').addEventListener('focus',()=>{if(!$('hQ').value.trim())showExamples()});
  $('hQ').addEventListener('input',()=>{
    clearTimeout(sTimer);
    const v=$('hQ').value.trim();
    if(!v){showExamples();return}
    sTimer=setTimeout(()=>suggest(v),200);
  });
  const run=()=>{hideDrop();home.q=$('hQ').value.trim();syncGames();homeLoad(true)};
  $('hGo').onclick=run;$('hQ').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
  $('fsBtn').onclick=()=>{const o=$('fp').classList.toggle('hidden');$('fsBtn').classList.toggle('open',!o);$('fsBtn').setAttribute('aria-expanded',String(!o))};
  document.querySelectorAll('#sSort button').forEach(b=>b.onclick=()=>{home.sort=b.dataset.v;syncFilters();homeLoad(true)});
  document.querySelectorAll('#sKey button').forEach(b=>b.onclick=()=>{home.key=b.dataset.v;syncFilters();homeLoad(true)});
  $('fReset').onclick=()=>{home.sort='new';home.key='all';home.executor='';home.features=[];syncFilters();homeLoad(true)};
  $('hAll').onclick=()=>{home.q='';$('hQ').value='';syncGames();homeLoad(true)};
  $('hMore').onclick=()=>{home.page++;homeLoad(false)};
  if(fcount()){$('fp').classList.remove('hidden');$('fsBtn').classList.add('open');$('fsBtn').setAttribute('aria-expanded','true')}
  syncFilters();
  DB.stats().then(st=>{
    if(!$('intro'))return;
    home.top=st.top;
    $('intro').innerHTML=`<u>${fmt(st.scripts)} free Roblox scripts</u> for <u>${fmt(st.games)} games</u>, shared by the community with <u>${fmt(st.views)} total views</u> and <button class="lnk" id="kLink">${fmt(st.keyless)} keyless</button>. Open a script, copy its loadstring and run it in your executor.`;
    $('kLink').onclick=()=>{home.key='no';syncFilters();homeLoad(true)};
    renderGameChips();
  }).catch(()=>{});
  homeLoad(true);
}
function syncGames(){document.querySelectorAll('#gChips .g').forEach(c=>c.classList.toggle('on',!!home.q&&c.dataset.g===home.q))}
function renderGameChips(){
  const box=$('gChips'),top=home.top;if(!box||!top.length)return;
  $('hot').classList.remove('hidden');
  box.innerHTML=top.map(g=>`<button class="g" data-g="${esc(g.name)}">${g.icon?`<img src="${esc(safeUrl(g.icon))}" alt="">`:'<span class="ph"></span>'}<span><b>${esc(g.name)}</b><small>${g.n} ${g.n===1?'script':'scripts'}</small></span></button>`).join('');
  box.querySelectorAll('.g').forEach(c=>c.onclick=()=>{home.q=c.dataset.g;$('hQ').value=home.q;syncGames();homeLoad(true)});
  syncGames();
}
async function homeLoad(reset){
  if(home.busy)return;home.busy=true;
  const grid=$('hGrid');if(!grid){home.busy=false;return}
  if(reset){home.page=0;home.items=[];grid.innerHTML='<div class="sk"></div>'.repeat(4)}
  $('hTitle').textContent=home.q?`Results for "${home.q}"`:(home.sort==='top'?'Most viewed scripts':'Latest scripts');
  const st=$('hStatus');st.className='hint';st.textContent='';
  try{
    const r=await DB.list(home);home.items.push(...r.items);home.more=r.more;
    grid.innerHTML=home.items.length?home.items.map(it=>cardHTML(it)).join(''):`<div class="empty" style="grid-column:1/-1"><h3>${home.q||fcount()?'No scripts found':'No scripts yet'}</h3>${home.q||fcount()?'Try another keyword or reset the filters.':'Publish the first one.'}<div class="actions" style="justify-content:center">${fcount()?'<button class="btn sec" id="emptyReset">Reset filters</button>':'<a class="btn" href="#publish">Publish a script</a>'}</div></div>`;
    const er=$('emptyReset');if(er)er.onclick=()=>$('fReset').click();
    $('hMore').classList.toggle('hidden',!home.more);
  }catch(e){grid.innerHTML='';st.className='err';st.textContent='Could not load scripts: '+e.message}
  home.busy=false;
}

async function initLikes(it){
  const btn=$('lkBtn');if(!btn)return;
  let liked=false,count=0,busy=false;
  const paint=()=>{const b=$('lkBtn');if(!b)return;b.classList.toggle('on',liked);b.querySelector('.n').textContent=fmt(count);b.setAttribute('aria-pressed',String(liked))};
  try{
    const l=await DB.likes(it.id),s=getSess();
    count=l.length;liked=!!s&&l.includes(s.id);
  }catch(e){}
  paint();
  btn.onclick=async()=>{
    if(!getSess()){toast('Log in to like scripts',1);return}
    if(busy)return;busy=true;
    try{
      if(liked){await DB.unlike(it.id);liked=false;count=Math.max(0,count-1)}
      else{await DB.like(it.id);liked=true;count++}
      paint();
    }catch(e){toast(e.message,1)}
    busy=false;
  };
}

async function initComments(it){
  const form=$('cmForm');if(!form)return;
  const s=getSess();
  const COOLDOWN=10*60*1000,REPLY_COOLDOWN=60*1000;
  let list=[],profs={},likes={},posting=false;
  const send=async(v,parent)=>{
    const k=(parent?'spl_rp_':'spl_cm_')+s.id,lim=parent?REPLY_COOLDOWN:COOLDOWN;
    const wait=lim-(Date.now()-LS.get(k,0));
    if(wait>0)throw new Error(`Cooldown active. You can ${parent?'reply':'comment'} again in ${wait>=60000?Math.ceil(wait/60000)+' min':Math.ceil(wait/1000)+' s'}.`);
    const c=await DB.addComment(it.id,v,parent);
    LS.set(k,Date.now());
    const cur=getSess();
    if(cur&&cur.profile)profs[cur.id]=cur.profile;
    list.push(c);likes[c.id]=[];
    return c;
  };
  if(s){
    form.innerHTML=`<div class="cmform"><textarea id="cmIn" maxlength="500" placeholder="Write a comment..."></textarea><div class="cmfoot"><span class="hint" id="cmN">0 / 500</span><button type="button" class="btn" id="cmPost">Post comment</button></div><div id="cmMsg"></div></div>`;
    $('cmIn').addEventListener('input',()=>{$('cmN').textContent=$('cmIn').value.length+' / 500'});
    $('cmPost').onclick=async()=>{
      const v=$('cmIn').value.trim(),m=$('cmMsg');
      if(!v){m.innerHTML='<div class="err">Write something first.</div>';return}
      if(posting)return;
      posting=true;$('cmPost').disabled=true;m.innerHTML='';
      try{
        await send(v,null);
        $('cmIn').value='';$('cmN').textContent='0 / 500';
        draw();
      }catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`}
      posting=false;if($('cmPost'))$('cmPost').disabled=false;
    };
  }else{
    form.innerHTML='<p class="hint" style="margin:0 0 6px"><a href="#account" style="color:var(--pink);font-weight:700">Log in</a> to write a comment.</p>';
  }
  const openReply=id=>{
    if(!getSess()){toast('Log in to reply',1);return}
    const c=list.find(x=>x.id===id),box=document.getElementById('rb-'+id);
    if(!c||!box)return;
    if(box.firstChild){box.innerHTML='';return}
    const top=c.parent_id&&list.some(x=>x.id===c.parent_id)?c.parent_id:c.id;
    box.innerHTML=`<div class="cmform"><textarea maxlength="500" placeholder="Reply to ${esc(c.author)}..."></textarea><div class="cmfoot"><span class="hint">0 / 500</span><span class="rowact"><button type="button" class="btn sec" data-x>Cancel</button><button type="button" class="btn" data-p>Reply</button></span></div><div class="rmsg"></div></div>`;
    const ta=box.querySelector('textarea'),cnt=box.querySelector('.hint'),msg=box.querySelector('.rmsg'),pb=box.querySelector('[data-p]');
    if(c.parent_id)ta.value='@'+c.author+' ';
    cnt.textContent=ta.value.length+' / 500';
    ta.addEventListener('input',()=>{cnt.textContent=ta.value.length+' / 500'});
    ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
    box.querySelector('[data-x]').onclick=()=>{box.innerHTML=''};
    pb.onclick=async()=>{
      const v=ta.value.trim();
      if(!v){msg.innerHTML='<div class="err">Write something first.</div>';return}
      if(posting)return;
      posting=true;pb.disabled=true;msg.innerHTML='';
      try{await send(v,top);draw()}
      catch(e){msg.innerHTML=`<div class="err">${esc(e.message)}</div>`;pb.disabled=false}
      posting=false;
    };
  };
  const toggleLike=async b=>{
    const cur=getSess();
    if(!cur){toast('Log in to like comments',1);return}
    if(b.dataset.busy)return;
    b.dataset.busy='1';
    const id=b.dataset.l,arr=likes[id]||(likes[id]=[]),on=arr.includes(cur.id);
    try{
      if(on){await DB.unlikeComment(id);likes[id]=arr.filter(x=>x!==cur.id)}
      else{await DB.likeComment(id);arr.push(cur.id)}
      b.classList.toggle('on',!on);b.setAttribute('aria-pressed',String(!on));
      b.querySelector('.n').textContent=likes[id].length||'';
    }catch(e){toast(e.message,1)}
    delete b.dataset.busy;
  };
  const draw=()=>{
    const box=$('cmList');if(!box)return;
    $('cmCount').textContent=list.length;
    if(!list.length){box.innerHTML='<p class="hint">No comments yet. Be the first.</p>';return}
    const cur=getSess(),byId={},kids={};
    list.forEach(c=>byId[c.id]=c);
    list.forEach(c=>{if(c.parent_id&&byId[c.parent_id])(kids[c.parent_id]||(kids[c.parent_id]=[])).push(c)});
    const tops=list.filter(c=>!c.parent_id||!byId[c.parent_id]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    const one=(c,rep)=>{
      const l=likes[c.id]||[],on=!!cur&&l.includes(cur.id),k=(kids[c.id]||[]).slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      const del=cur&&(cur.id===c.user_id||cur.id===OWNER_ID)?`<button type="button" class="dn" data-d="${esc(c.id)}">Delete</button>`:'';
      return `<div class="cm${rep?' rp':''}"><span class="uav"${uAttr(c.user_id)}>${avatarHTML(profs[c.user_id],c.author,rep?30:36)}</span><div class="cb"><div class="ch"><b>${uLink(c.user_id,c.author)}</b>${ownerTag(c.user_id)}<small>${esc(timeAgo(c.created_at))}</small>${del}</div><div class="ct">${esc(c.body)}</div><div class="ca"><button type="button" class="cl${on?' on':''}" data-l="${esc(c.id)}" aria-pressed="${on}" aria-label="Like comment">${ICON_HEART}<span class="n">${l.length||''}</span></button><button type="button" data-r="${esc(c.id)}">Reply</button></div><div class="rbox" id="rb-${esc(c.id)}"></div>${!rep&&k.length?`<div class="reps">${k.map(x=>one(x,true)).join('')}</div>`:''}</div></div>`;
    };
    box.innerHTML=tops.map(c=>one(c,false)).join('');
    box.onclick=async e=>{
      const d=e.target.closest('[data-d]'),l=e.target.closest('[data-l]'),r=e.target.closest('[data-r]');
      if(d){
        const id=d.dataset.d,hasKids=list.some(x=>x.parent_id===id);
        if(!await ask('Delete this comment?',hasKids?'This comment and all replies to it will be removed for everyone.':'This comment will be removed for everyone.'))return;
        try{
          await DB.removeComment(id);
          const gone=new Set([id,...list.filter(x=>x.parent_id===id).map(x=>x.id)]);
          list=list.filter(x=>!gone.has(x.id));draw();toast('Comment deleted');
        }catch(er){toast(er.message,1)}
      }else if(l)toggleLike(l);
      else if(r)openReply(r.dataset.r);
    };
  };
  try{
    list=await DB.comments(it.id);
    if(!$('cmList'))return;
    draw();
    const [pf,lk]=await Promise.all([Prof.many([...new Set(list.map(c=>c.user_id))]),DB.commentLikes(list.map(c=>c.id)).catch(()=>({}))]);
    if(!$('cmList'))return;
    profs=pf;likes=lk;
    draw();
  }catch(e){
    if($('cmList'))$('cmList').innerHTML=`<p class="err">Could not load comments: ${esc(e.message)}</p>`;
  }
}

async function search(v){
  const seq=++searchSeq,res=$('results'),err=$('gameErr'),spin=$('spin');if(!res)return;
  err.textContent='';spin.classList.remove('hidden');
  try{
    const m=v.match(/roblox\.com\/(?:[a-z-]+\/)?games\/(\d+)/i),pid=m?m[1]:(/^\d{5,}$/.test(v)?v:null);
    const map=g=>({universeId:g.id,name:g.name,placeId:g.rootPlaceId,playing:g.playing,visits:g.visits});
    let list=[];
    if(pid){
      const u=await getJSON(`${PROXY.apis}/universes/v1/places/${pid}/universe`);
      if(!u.universeId)throw new Error('Place ID not found');
      list=(await getJSON(`${PROXY.games}/v1/games?universeIds=${u.universeId}`)).data.map(map);
    }else{
      const d=await getJSON(`${PROXY.apis}/search-api/omni-search?searchQuery=${encodeURIComponent(v)}&sessionId=${crypto.randomUUID()}&pageType=all`);
      const games=[];(d.searchResults||[]).forEach(r=>{if(r.contentGroupType==='Game')(r.contents||[]).forEach(c=>games.push(c))});
      const ids=games.slice(0,10).map(g=>g.universeId);
      if(!ids.length)throw new Error('No games found for "'+v+'"');
      list=(await getJSON(`${PROXY.games}/v1/games?universeIds=${ids.join(',')}`)).data.map(map);
    }
    const ic=await icons(list.map(g=>g.universeId));
    if(seq!==searchSeq)return;
    list.forEach(g=>g.icon=ic[g.universeId]||'');
    res.innerHTML='';
    list.forEach(g=>{
      const d=document.createElement('div');d.className='game';
      d.innerHTML=`<img src="${esc(g.icon)}" alt=""><div><b>${esc(g.name)}</b><small>${fmt(g.playing)} playing, ${fmt(g.visits)} visits</small></div>`;
      d.onclick=()=>pickGame(g);res.appendChild(d);
    });
  }catch(e){if(seq===searchSeq){res.innerHTML='';err.textContent=e.message}}
  if(seq===searchSeq&&$('spin'))$('spin').classList.add('hidden');
}

const Prof={
  async load(id){
    if(!id)return{};
    if(REMOTE){try{const r=await rq(`/rest/v1/profiles?id=eq.${encodeURIComponent(id)}&select=id,avatar,bio,link,color,username`);return r[0]||{}}catch(e){return{}}}

    return u?{id,avatar:u.avatar||'',bio:u.bio||'',link:u.link||'',color:u.color||'',username:u.username||''}:{};
  },
  async many(ids){
    const out={};
    if(!ids.length)return out;
    if(REMOTE){
      const ok=ids.filter(isUUID);
      if(!ok.length)return out;
      try{const r=await rq(`/rest/v1/profiles?id=in.(${ok.map(encodeURIComponent).join(',')})&select=id,avatar,color,username`);r.forEach(p=>out[p.id]=p)}catch(e){}

  },
  async sync(){

    const p=await Prof.load(s.id);
    if(REMOTE&&p.username!==s.username){
      try{await rq('/rest/v1/profiles?on_conflict=id',{method:'POST',body:{id:s.id,username:s.username},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});p.username=s.username}catch(e){}

    LS.set('spl_sess',{...getSess(),profile:p,created});

    else{const all=LS.get('spl_users',{});if(!all[s.id])throw new Error('Account not found');Object.assign(all[s.id],p);LS.set('spl_users',all)}
    LS.set('spl_sess',{...getSess(),profile:p});

  }
};
function readAvatar(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type))return rej(new Error('Choose a PNG, JPG or WebP image.'));
    if(file.size>8*1024*1024)return rej(new Error('That image is larger than 8 MB.'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const S=192,c=document.createElement('canvas');c.width=c.height=S;
      const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
      c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,S,S);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read this image.'))};
    im.src=url;
  });
}
