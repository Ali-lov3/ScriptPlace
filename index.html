async function rq(path,{method='GET',body,headers={},auth=true,retry=true}={}){
  const s=getSess();
  const h={apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json',Authorization:'Bearer '+((auth&&s&&s.token)||CFG.SUPABASE_ANON_KEY),...headers};
  const r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401&&retry&&auth&&s&&s.refresh&&await refreshTok())return rq(path,{method,body,headers,auth,retry:false});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.msg||j.message||j.error_description||j.error||m}catch(e){}throw new Error(m)}
  const t=await r.text();return t?JSON.parse(t):null;
}
async function refreshTok(){const s=getSess();try{const j=await rq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh},auth:false,retry:false});LS.set('spl_sess',{...s,token:j.access_token,refresh:j.refresh_token});return true}catch(e){LS.set('spl_sess',null);return false}}

const Auth={
  async register(email,username,password){
    if(REMOTE){
      const j=await rq('/auth/v1/signup',{method:'POST',body:{email,password,data:{username}},auth:false});
      if(j&&j.access_token){LS.set('spl_sess',sessFrom(j));return 'ok'}
      return 'confirm';
    }
    const all=LS.get('spl_users',{}),k=email.toLowerCase();
    if(all[k])throw new Error('Email already registered');
    if(Object.values(all).some(u=>u.username.toLowerCase()===username.toLowerCase()))throw new Error('Username already taken');
    const salt=crypto.randomUUID();all[k]={email:k,username,salt,hash:await sha(salt+password),created:Date.now()};
    LS.set('spl_users',all);LS.set('spl_sess',{id:k,email:k,username,created:all[k].created});return 'ok';
  },
  async login(email,password){
    if(REMOTE){const j=await rq('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false});LS.set('spl_sess',sessFrom(j));return}
    const u=LS.get('spl_users',{})[email.toLowerCase()];
    if(!u||await sha(u.salt+password)!==u.hash)throw new Error('Wrong email or password');

  },

  async changePassword(oldP,newP){

const Badges={
  async ensure(ids){
    const need=[...new Set(ids.filter(Boolean))].filter(i=>!(i in UB));
    if(!need.length)return;
    need.forEach(i=>{UB[i]={views:0,verified:false,tag:'',tier:'',eq:''}});
    if(REMOTE){
      const ok=need.filter(isUUID);if(!ok.length)return;
      const list=ok.map(encodeURIComponent).join(',');
      const nkP=rq(`/rest/v1/profiles?id=in.(${list})&select=id,nickname,frame,name_font`).then(nk=>nk.forEach(r=>{if(r.nickname)NICKS[r.id]=r.nickname;NFONT[r.id]=r.name_font||'';UB[r.id].eq=r.frame||''})).catch(()=>{});
      try{
        const [v,b]=await Promise.all([
          rq(`/rest/v1/creator_views?user_id=in.(${list})&select=user_id,total_views`),
          rq(`/rest/v1/user_badges?user_id=in.(${list})&select=user_id,verified,tag,tier`)
        ]);
        v.forEach(r=>{UB[r.user_id].views=Number(r.total_views)||0});
        b.forEach(r=>{UB[r.user_id].verified=!!r.verified;UB[r.user_id].tag=r.tag||'';UB[r.user_id].tier=r.tier||''});
      }catch(e){}
      await nkP;
      return;
    }
    const sc=LS.get('spl_scripts',[]),bd=LS.get('spl_badges',{}),us=LS.get('spl_users',{});
    need.forEach(i=>{
      if(us[i]&&us[i].nickname)NICKS[i]=us[i].nickname;
      if(us[i])NFONT[i]=us[i].name_font||'';
      UB[i].views=sc.filter(x=>x.user_id===i).reduce((a,x)=>a+(x.views||0),0);
      if(bd[i]){UB[i].verified=!!bd[i].verified;UB[i].tag=bd[i].tag||'';UB[i].tier=bd[i].tier||''}
    });
  },
  async save(id,verified,tag,tier){
    const t=String(tag||'').trim().slice(0,20),was=!!(UB[id]&&UB[id].verified);

      await rq('/rest/v1/user_badges?on_conflict=user_id',{method:'POST',body:{user_id:id,verified,tag:t||null,tier:tier||null,updated_at:new Date().toISOString()},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});

  }
};

const Verify={
  async status(id){
    if(REMOTE){if(!isUUID(id))return null;const r=await rq(`/rest/v1/verify_requests?user_id=eq.${encodeURIComponent(id)}&select=status,created_at`);return r[0]||null}

  },
  async request(){
    const s=getSess(),waitMsg='You can request again 10 minutes after a decline.';
    if(REMOTE){
      try{await rq(`/rest/v1/verify_requests?user_id=eq.${encodeURIComponent(s.id)}&status=eq.rejected`,{method:'DELETE'})}catch(e){}
      try{await rq('/rest/v1/verify_requests',{method:'POST',body:{user_id:s.id,author:s.username,status:'pending'},headers:{Prefer:'return=minimal'}})}
      catch(e){if(/duplicate|already exists/i.test(e.message))throw new Error(waitMsg);throw e}
      return;
    }
    const d=await Verify.lastDecline(s.id);
    if(d&&new Date(d.created_at).getTime()+VERIFY_WAIT>Date.now())throw new Error(waitMsg);
    const a=LS.get('spl_verify',{});a[s.id]={author:s.username,status:'pending',created_at:new Date().toISOString()};LS.set('spl_verify',a);
  },
  async decline(id,reason){

    await Verify.notify(id,'declined',reason);
  },
  async notify(id,status,reason){

  },
  async lastDecline(id){

};

const Frames={
  uid:'',
  p:null,
  owned:null,
  load(force){

    if(!force&&this.p)return this.p;

      if(s.id===OWNER_ID)return FRAMES.map(f=>f[0]);

async function adClick(e){
  const t=e.target.closest('button,a');if(!t)return;

    if(t.dataset.u){

    }
    if(t.dataset.fill){const inp=t.closest('.ads').querySelector('.adv');inp.value=(parseInt(inp.value,10)||0)+Number(t.dataset.fill);return}
    if(t.dataset.um){const m=await askMessage(t.dataset.n);if(m===null)return;await Msg.send(t.dataset.um,'message',m);toast('Message sent');return}
    if(t.dataset.ut){
      const id=t.dataset.ut;
      if(adm.to[id]){await Timeout.clear(id);delete adm.to[id];toast('Timeout removed');drawAdUsers();return}
      const r=await askTimeout(t.dataset.n);if(!r)return;
      await Timeout.set(id,r.minutes,r.reason);
      adm.to[id]={user_id:id,until:new Date(Date.now()+r.minutes*60000).toISOString(),reason:r.reason};
      toast('User timed out');drawAdUsers();return;
    }
    if(t.dataset.gf){await giftEditor(t.dataset.gf,t.dataset.n);return}
    if(t.dataset.bd){if(await badgeEditor(t.dataset.bd,t.dataset.n)){adm.users=await Admin.users();drawAdUsers()}return}
    if(t.dataset.add){
      const row=t.closest('.ads'),n=parseInt(row.querySelector('.adv').value,10);
      if(!n){toast('Enter a number',1);return}
      t.disabled=true;
      const sid=t.dataset.add,uid=adm.open,it=adm.sc[uid].find(x=>x.id===sid),old=Number(it.views)||0;
      const v=Number(await Admin.addViews(sid,n));
      it.views=v;const u=adm.users.find(x=>x.id===uid);if(u)u.views=Number(u.views)-old+v;
      toast('Views updated');drawAdUsers();return;

      const sid=t.dataset.del,uid=adm.open,it=adm.sc[uid].find(x=>x.id===sid);

      const r=await rq(`/rest/v1/script_reports?script_id=eq.${encodeURIComponent(t.dataset.sid)}&reporter_id=eq.${encodeURIComponent(t.dataset.rp)}`,{method:'DELETE'});

      toast('Report dismissed');drawAdBody();nLoad();return;
    }
  }catch(er){toast(er.message,1);if(t.disabled)t.disabled=false}
}

  syncFilters();
  DB.stats().then(st=>{
    if(!$('intro'))return;

    $('intro').innerHTML=`<u>${fmt(st.scripts)} free Roblox scripts</u> for <u>${fmt(st.games)} games</u>, shared by the community with <u>${fmt(st.views)} total views</u> and <button class="lnk" id="kLink">${fmt(st.keyless)} keyless</button>. Open a script, copy its loadstring and run it in your executor.`;

async function initLikes(it){
  const btn=$('lkBtn');if(!btn)return;
  let liked=false,count=0,busy=false;
  const paint=()=>{const b=$('lkBtn');if(!b)return;b.classList.toggle('on',liked);b.querySelector('.n').textContent=fmt(count);b.setAttribute('aria-pressed',String(liked))};
  try{
    const l=await DB.likes(it.id),s=getSess();
    count=l.length;liked=!!s&&l.includes(s.id);
  }catch(e){}
  paint();
  btn.onclick=async()=>{
    if(!getSess()){toast('Log in to like scripts',1);return}
    if(busy)return;busy=true;
    try{
      if(liked){await DB.unlike(it.id);liked=false;count=Math.max(0,count-1)}
      else{await DB.like(it.id);liked=true;count++}
      paint();
    }catch(e){toast(e.message,1)}
    busy=false;
  };
}

async function initComments(it){

      const wait=RCOOLDOWN-(Date.now()-lastR);
      if(wait>0){m.innerHTML=`<div class="err">Slow down. You can reply again in ${Math.ceil(wait/1000)} s.</div>`;return}
      posting=true;$('rPost').disabled=true;m.innerHTML='';
      try{
        const c=await DB.addComment(it.id,v,pid);
        await Badges.ensure([c.user_id]);
        lastR=Date.now();
        LS.set('spl_rp_'+getSess().id,lastR);
        const cur=getSess();
        if(cur&&cur.profile)profs[cur.id]=cur.profile;

const T_RE=/^(\d{1,3}(?:\.\d{1,2})?),(\d{1,3}(?:\.\d{1,2})?),(\d(?:\.\d{1,2})?)$/;
function parseT(s){
  const m=T_RE.exec(s||'');
  if(!m)return{x:50,y:50,z:1};
  return{x:Math.min(100,+m[1]),y:Math.min(100,+m[2]),z:Math.min(4,Math.max(1,+m[3]))};

  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const S=512,t=parseT(tStr),nw=im.naturalWidth||1,nh=im.naturalHeight||1,c=Math.max(S/nw,S/nh),dw=nw*c,dh=nh*c;
      const ox=(S-dw)*t.x/100,oy=(S-dh)*t.y/100,Ox=S*t.x/100,Oy=S*t.y/100;
      const X=Ox+t.z*(ox-Ox),Y=Oy+t.z*(oy-Oy);

function trimGif(u8,max){

  out.set(u8.subarray(0,end));

function adjustImage(kind,src,tStr){
  return new Promise(res=>{
    let t=parseT(tStr),drag=null;
    const o=document.createElement('div');
    o.className='mo';
    o.innerHTML=`<div class="md ae" role="dialog" aria-modal="true"><h3>${kind==='avatar'?'Adjust profile photo':kind==='icon'?'Adjust script image':'Adjust banner'}</h3><p>Drag the image to move it. Use the slider or the mouse wheel to zoom.</p><div class="aefr ${kind}" id="aeF"><img id="aeI" alt="" draggable="false" src="${esc(src)}"></div><label>Zoom</label><input type="range" id="aeZ" min="1" max="4" step="0.01"><div class="mbtn" style="margin-top:18px"><button type="button" class="btn sec" id="aeR">Reset</button><button type="button" class="btn sec" id="aeC">Cancel</button><button type="button" class="btn" id="aeA">Apply</button></div></div>`;
    document.body.appendChild(o);
    const F=$('aeF'),I=$('aeI'),Z=$('aeZ');
    const paintT=()=>{I.style.cssText=imgPosT(t);Z.value=t.z};
    const done=v=>{document.removeEventListener('keydown',key);o.remove();res(v)};
    const key=e=>{if(e.key==='Escape')done(null)};

  });
}

    if(left>0){
      $('vrArea').innerHTML='<p class="hint">Your verify request was declined.'+why+' You can request again in '+Math.ceil(left/60000)+' min.</p>';
      setTimeout(()=>{if($('vrArea'))initVerify(id)},Math.min(left,60000)+500);
      return;
    }
    note='<p class="hint">Your last verify request was declined.'+why+'</p>';
  }else if(st){$('vrArea').innerHTML='<button type="button" class="btn sec" disabled style="margin-top:12px">Verify requested</button>';return}
  $('vrArea').innerHTML=note+'<button type="button" class="btn" id="vrBtn" style="margin-top:12px">Request Verify</button><div id="vrMsg"></div>';
  $('vrBtn').onclick=async()=>{
    $('vrBtn').disabled=true;
    try{await Verify.request();toast('Verify request sent');initVerify(id)}
    catch(e){$('vrMsg').innerHTML=`<div class="err">${esc(e.message)}</div>`;$('vrBtn').disabled=false}
  };
}
async function pageUser(id){
  const s=getSess();
  if(s&&s.id===id){go('account');return}
  if(REMOTE&&!isUUID(id)){$('app').innerHTML='<div class="card empty"><h3>User not found</h3><a class="btn" href="#home">Back to scripts</a></div>';return}
  $('app').innerHTML='<div class="sk" style="height:240px"></div>';
  try{
    const adm=!!s&&s.id===OWNER_ID;
    const [p,list,,vq,tq]=await Promise.all([Prof.load(id),DB.byUser(id),Badges.ensure([id]),adm?Verify.status(id).catch(()=>null):null,adm?Timeout.get(id).catch(()=>null):null]);
    if((location.hash.slice(1).split('/')[1]||'')!==id)return;
    const uname=p.username||NAMES[id]||(list[0]&&list[0].author)||'User';
    if(p.nickname)NICKS[id]=p.nickname;
    const name=dn(id,uname);
    NAMES[id]=uname;
    const col=AV_COLORS.includes(p.color)?p.color:AV_COLORS[0],views=list.reduce((a,x)=>a+(x.views||0),0),plink=safeUrl(p.link);
    const first=list.length?new Date(list[list.length-1].created_at).toLocaleDateString('en-US',{month:'short',year:'numeric'}):'-';
    const admin=!!s&&s.id===OWNER_ID;
    $('app').innerHTML=`<section class="prof"><div class="pban" style="${bannerCSS(p,col)}">${bannerImg(p)}</div><div class="pbody"><div id="pAv">${avatarHTML(p,name,88)}</div>
      <div class="pinfo"><h1>${nameHTML(id,uname)}${ownerTag(id)}</h1>${name!==uname?`<span class="hint" style="margin:0">@${esc(uname)}</span>`:''}<p class="pbio">${esc(p.bio||'')}</p><div class="fwarea" id="fwArea"></div>${admin&&tq?`<p class="hint">Timed out until ${esc(new Date(tq.until).toLocaleString('en-US'))}${tq.reason?' - '+esc(tq.reason):''}</p>`:''}${plink?`<a class="plink" href="${esc(plink)}" target="_blank" rel="noopener noreferrer">Community link</a>`:''}${admin?`<div class="actions" style="margin-top:12px"><button class="btn sec" id="ubBtn">Badges</button><button class="btn sec" id="ufBtn">Frames</button><button class="btn sec" id="umBtn">Message</button><button class="btn sec" id="utBtn">${tq?'Remove timeout':'Timeout'}</button>${vq&&vq.status==='pending'?'<button class="btn" id="vaBtn">Approve verify</button><button class="btn danger" id="vdBtn">Decline</button>':''}</div>${vq&&vq.status==='pending'?'<p class="hint">This user requested a verify badge.</p>':''}`:''}</div>
      <div class="pstats"><div><i class="si">${ICON_CODE}</i><b>${list.length}</b><span>Scripts</span></div><div><i class="si">${ICON_EYE}</i><b>${fmt(views)}</b><span>Views</span></div>${fwStats()}<div><i class="si">${ICON_CAL}</i><b>${esc(first)}</b><span>First script</span></div></div></div></section>
    <section class="mysec"><div class="rowh"><h2>Scripts by ${esc(name)} <span class="cnt">${list.length}</span></h2></div><div class="feed">${list.length?list.map(it=>cardHTML({...it,author:name})).join(''):'<div class="empty" style="grid-column:1/-1"><h3>No scripts yet</h3>This user has not published anything.</div>'}</div></section>`;
    initFollow(id,name);paintFollowCounts(id,name);
    if(admin)$('ubBtn').onclick=async()=>{if(await badgeEditor(id,name))pageUser(id)};
    if(admin)$('ufBtn').onclick=()=>giftEditor(id,name);
    if(admin){
      $('umBtn').onclick=async()=>{const m=await askMessage(name);if(m===null)return;try{await Msg.send(id,'message',m);toast('Message sent')}catch(e){toast(e.message,1)}};
      $('utBtn').onclick=async()=>{
        if(tq){try{await Timeout.clear(id);toast('Timeout removed');pageUser(id)}catch(e){toast(e.message,1)}return}
        const r=await askTimeout(name);if(!r)return;
        try{await Timeout.set(id,r.minutes,r.reason);toast('User timed out');pageUser(id)}catch(e){toast(e.message,1)}
      };
    }
    if($('vaBtn'))$('vaBtn').onclick=async()=>{try{await Badges.save(id,true,(UB[id]||{}).tag,(UB[id]||{}).tier);toast('User verified');pageUser(id)}catch(e){toast(e.message,1)}};
    if($('vdBtn'))$('vdBtn').onclick=async()=>{const r=await askReason(name);if(r===null)return;try{await Verify.decline(id,r);toast('Request declined');pageUser(id)}catch(e){toast(e.message,1)}};
  }catch(e){$('app').innerHTML=`<div class="card"><p class="err">${esc(e.message)}</p></div>`}
}
async function oauthReturn(){
  const qs=new URLSearchParams(location.search),hs=new URLSearchParams(location.hash.slice(1));
  const hasTok=hs.get('access_token'),errMsg=hs.get('error_description')||qs.get('error_description');
  if(!hasTok&&!errMsg)return;
  history.replaceState(null,'',location.pathname+'#home');
  if(errMsg){toast(errMsg.replace(/\+/g,' '),1);return}
  try{
    const token=hs.get('access_token'),refresh=hs.get('refresh_token');
    const r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/user',{headers:{apikey:CFG.SUPABASE_ANON_KEY,Authorization:'Bearer '+token}});
    if(!r.ok)throw new Error('Login failed');
    const u=await r.json();
    LS.set('spl_sess',sessFrom({user:u,access_token:token,refresh_token:refresh}));
    try{await Prof.sync()}catch(e){}
    toast('Logged in');
  }catch(e){toast(e.message,1)}
}
oauthReturn().finally(route);
(function(){
  const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const valDesc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  let cur=null,lastPick=0;
  function closeDd(){
    if(!cur)return;
    cur.list.remove();
    cur.wrap.classList.remove('open');
    cur.btn.setAttribute('aria-expanded','false');
    cur=null;
  }
  function openDd(sel,wrap,btn){
    if(cur&&cur.sel===sel){closeDd();return}
    closeDd();
    const opts=[...sel.options];
    if(!opts.length)return;
    const list=document.createElement('div');
    list.className='ddlist';
    list.setAttribute('role','listbox');
    list.innerHTML=opts.map((o,i)=>`<div class="ddo${i===sel.selectedIndex?' on':''}" role="option" aria-selected="${i===sel.selectedIndex}" data-i="${i}"><span${o.dataset.ff?` style="font-family:${esc(o.dataset.ff)};font-weight:${esc(o.dataset.fw||'400')}"`:''}>${esc(o.textContent)}</span>${CHECK}</div>`).join('');
    document.body.appendChild(list);
    const r=btn.getBoundingClientRect();
    const below=window.innerHeight-r.bottom-14,above=r.top-14;
    const natural=Math.min(list.scrollHeight,280);
    const up=below<Math.min(natural,200)&&above>below;
    list.style.left=r.left+'px';
    list.style.width=r.width+'px';
    list.style.maxHeight=Math.max(120,Math.min(280,up?above:below))+'px';
    if(up){list.style.bottom=(window.innerHeight-r.top+6)+'px';list.classList.add('up')}
    else list.style.top=(r.bottom+6)+'px';
    wrap.classList.add('open');
    btn.setAttribute('aria-expanded','true');
    const items=[...list.children];
    let act=Math.max(0,sel.selectedIndex);
    const setAct=(i,scroll)=>{
      act=i;
      items.forEach((e,k)=>e.classList.toggle('act',k===i));
      if(scroll&&items[i])items[i].scrollIntoView({block:'nearest'});
    };
    const pick=i=>{
      const v=opts[i].value,changed=valDesc.get.call(sel)!==v;
      lastPick=Date.now();
      closeDd();
      btn.focus();
      if(changed){
        sel.value=v;
        sel.dispatchEvent(new Event('input',{bubbles:true}));
        sel.dispatchEvent(new Event('change',{bubbles:true}));
      }
    };
    items.forEach((e,i)=>{
      e.addEventListener('mousemove',()=>{if(act!==i)setAct(i,false)});
      e.addEventListener('click',()=>pick(i));
    });
    list.addEventListener('pointerdown',e=>e.preventDefault());
    setAct(act,true);
    cur={sel,wrap,btn,list,items,pick,setAct,get act(){return act},opts};
  }
  function enhance(sel){
    if(sel.dataset.dd)return;
    sel.dataset.dd='1';
    const wrap=document.createElement('div');
    wrap.className='dd';
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='ddb';
    btn.setAttribute('aria-haspopup','listbox');
    btn.setAttribute('aria-expanded','false');
    btn.innerHTML='<span class="ddl"></span>'+CHEV;
    sel.parentNode.insertBefore(wrap,sel);
    wrap.appendChild(btn);
    wrap.appendChild(sel);
    sel.classList.add('ddn');
    sel.tabIndex=-1;
    sel.setAttribute('aria-hidden','true');
    const sync=()=>{const o=sel.options[sel.selectedIndex],l=btn.firstChild;l.textContent=o?o.textContent:'';l.style.fontFamily=o&&o.dataset.ff||'';l.style.fontWeight=o&&o.dataset.fw||''};
    Object.defineProperty(sel,'value',{get(){return valDesc.get.call(sel)},set(v){valDesc.set.call(sel,v);sync()},configurable:true});
    new MutationObserver(sync).observe(sel,{childList:true,subtree:true,characterData:true});
    sync();
    btn.addEventListener('click',()=>{if(Date.now()-lastPick<250)return;openDd(sel,wrap,btn)});
    btn.addEventListener('keydown',e=>{
      if(!cur&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();openDd(sel,wrap,btn)}
    });
  }
  const scan=()=>document.querySelectorAll('select:not([data-dd])').forEach(enhance);
  let queued=false;
  new MutationObserver(()=>{
    if(cur&&!document.contains(cur.wrap))closeDd();
    if(queued)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;scan()});
  }).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('pointerdown',e=>{
    if(cur&&!cur.list.contains(e.target)&&!cur.wrap.contains(e.target))closeDd();
  },true);
  document.addEventListener('keydown',e=>{
    if(!cur)return;
    const n=cur.items.length;
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();const b=cur.btn;closeDd();b.focus()}
    else if(e.key==='ArrowDown'){e.preventDefault();cur.setAct((cur.act+1)%n,true)}
    else if(e.key==='ArrowUp'){e.preventDefault();cur.setAct((cur.act-1+n)%n,true)}
    else if(e.key==='Home'){e.preventDefault();cur.setAct(0,true)}
    else if(e.key==='End'){e.preventDefault();cur.setAct(n-1,true)}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();cur.pick(cur.act)}
    else if(e.key==='Tab')closeDd();
  },true);
  window.addEventListener('scroll',e=>{if(cur&&!cur.list.contains(e.target))closeDd()},true);
  window.addEventListener('resize',closeDd);
  scan();
})();
</script>
