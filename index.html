<script>
const CFG=window.SCRIPTPLACE_CONFIG,REMOTE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
const PROXY={games:'https://games.roproxy.com',apis:'https://apis.roproxy.com',thumbs:'https://thumbnails.roproxy.com'};
const PRESETS=['Auto Farm','Auto Hatch','Auto Sell','Auto Collect','Auto Buy','Anti AFK','Teleport','Speed Boost','ESP','Infinite Jump','GUI','Kill Aura','Auto Quest'];
const EXECUTORS=['Potassium','Matcha','Xeno','Bunni.lol','Photon','Synapse Z','AWP.GG','Wave','Volcano','Velocity','Seliware','Solara','Codex','Delta','Arceus X','Ronix','Zenith'];
const SUGG=['Blox Fruits','Brookhaven','Adopt Me','Grow a Garden','Steal a Brainrot','Murder Mystery 2','Pet Simulator 99','Fisch','Arsenal','Doors'];
const PAGE=12;
const ICON_EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-4.8-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6.2-8 11-8 11z"/></svg>';
const ICON_CHAT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
const ICON_TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const OWNER_ID='53258b8b-2f10-4c07-9b18-aac9c4981288';
const ownerTag=id=>id===OWNER_ID?'<span class="owner">Owner</span>':'';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//i.test(u||'')?u:'';
const go=p=>{location.hash=p};
const getSess=()=>LS.get('spl_sess',null);
const fmt=n=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};
function timeAgo(d){
  if(!d)return 'just now';
  const s=(Date.now()-new Date(d).getTime())/1000;
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+'min ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<2592000)return Math.floor(s/86400)+'d ago';
  return new Date(d).toLocaleDateString('en-US');
}
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2600)}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function copy(t,label){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(label||'Copied to clipboard')}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function icons(ids){if(!ids.length)return{};try{const d=await getJSON(`${PROXY.thumbs}/v1/games/icons?universeIds=${ids.join(',')}&size=256x256&format=Png&isCircular=false`);const m={};d.data.forEach(x=>m[x.targetId]=x.imageUrl);return m}catch(e){return{}}}
const fresh=()=>({game:null,features:['Auto Farm'],title:'',description:'',code:'',link:'',access:'free',executors:[],editId:null,rules:false});
let draft=fresh();
const saveDraft=()=>{};try{localStorage.removeItem('spl_draft')}catch(e){}
const isUUID=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v||'');
if(REMOTE){
  const _s=getSess();if(_s&&!_s.token)LS.set('spl_sess',null);
  if(draft.editId&&!isUUID(draft.editId)){draft=fresh();saveDraft()}
  if(location.hash.startsWith('#script/')&&!isUUID(location.hash.slice(8)))location.hash='home';
}

async function rq(path,{method='GET',body,headers={},auth=true,retry=true}={}){
  const s=getSess();
  const h={apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json',Authorization:'Bearer '+((auth&&s&&s.token)||CFG.SUPABASE_ANON_KEY),...headers};
  const r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401&&retry&&auth&&s&&s.refresh&&await refreshTok())return rq(path,{method,body,headers,auth,retry:false});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.msg||j.message||j.error_description||j.error||m}catch(e){}throw new Error(m)}
  const t=await r.text();return t?JSON.parse(t):null;
}
async function refreshTok(){const s=getSess();try{const j=await rq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh},auth:false,retry:false});LS.set('spl_sess',{...s,token:j.access_token,refresh:j.refresh_token});return true}catch(e){LS.set('spl_sess',null);return false}}
const sessFrom=j=>{const m=j.user.user_metadata||{},em=j.user.email||'';return{id:j.user.id,email:em,username:String(m.username||(m.custom_claims&&m.custom_claims.global_name)||m.full_name||m.name||m.preferred_username||em.split('@')[0]||'user').slice(0,30),created:j.user.created_at,token:j.access_token,refresh:j.refresh_token}};

const Auth={
  async register(email,username,password){
    if(REMOTE){
      const j=await rq('/auth/v1/signup',{method:'POST',body:{email,password,data:{username}},auth:false});
      if(j&&j.access_token){LS.set('spl_sess',sessFrom(j));return 'ok'}
      return 'confirm';
    }
    const all=LS.get('spl_users',{}),k=email.toLowerCase();
    if(all[k])throw new Error('Email already registered');
    if(Object.values(all).some(u=>u.username.toLowerCase()===username.toLowerCase()))throw new Error('Username already taken');
    const salt=crypto.randomUUID();all[k]={email:k,username,salt,hash:await sha(salt+password),created:Date.now()};
    LS.set('spl_users',all);LS.set('spl_sess',{id:k,email:k,username,created:all[k].created});return 'ok';
  },
  async login(email,password){
    if(REMOTE){const j=await rq('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false});LS.set('spl_sess',sessFrom(j));return}
    const u=LS.get('spl_users',{})[email.toLowerCase()];
    if(!u||await sha(u.salt+password)!==u.hash)throw new Error('Wrong email or password');
    LS.set('spl_sess',{id:u.email,email:u.email,username:u.username,created:u.created});
  },
  discord(){location.href=CFG.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/authorize?provider=discord&redirect_to='+encodeURIComponent(location.origin+location.pathname)},
  logout(){LS.set('spl_sess',null);draft=fresh()},
  async changePassword(oldP,newP){
    if(REMOTE){await rq('/auth/v1/user',{method:'PUT',body:{password:newP}});return}
    const s=getSess(),all=LS.get('spl_users',{}),u=all[s.id];
    if(await sha(u.salt+oldP)!==u.hash)throw new Error('Current password is wrong');
    u.salt=crypto.randomUUID();u.hash=await sha(u.salt+newP);LS.set('spl_users',all);
  }
};

const DB={
  async list({q='',sort='new',page=0,key='all',features=[],executor=''}){
    const hasF=features.length>0||!!executor;
    const match=x=>features.every(f=>(x.features||[]).includes(f))&&(!executor||(x.executors||[]).includes(executor));
    const keyOk=x=>key==='all'||(key==='no'&&!x.key_system&&!x.paid)||(key==='yes'&&!!x.key_system)||(key==='paid'&&!!x.paid);
    if(REMOTE){
      let p=`/rest/v1/scripts?select=id,user_id,title,game_name,icon,features,executors,key_system,paid,views,author,created_at&order=${sort==='top'?'views.desc':'created_at.desc'}`;
      p+=hasF?'&limit=400':`&limit=${PAGE+1}&offset=${page*PAGE}`;
      const c=q.replace(/[,()*%]/g,' ').trim();
      if(c)p+=`&or=(title.ilike.*${encodeURIComponent(c)}*,game_name.ilike.*${encodeURIComponent(c)}*)`;
      if(key==='no')p+='&key_system=eq.false&paid=eq.false';
      if(key==='yes')p+='&key_system=eq.true';
      if(key==='paid')p+='&paid=eq.true';
      let rows=await rq(p);
      if(hasF){rows=rows.filter(match);return{items:rows.slice(page*PAGE,page*PAGE+PAGE),more:rows.length>page*PAGE+PAGE}}
      return{items:rows.slice(0,PAGE),more:rows.length>PAGE};
    }
    let a=LS.get('spl_scripts',[]);const c=q.toLowerCase().trim();
    if(c)a=a.filter(x=>(x.title+' '+(x.game_name||'')).toLowerCase().includes(c));
    a=a.filter(keyOk);
    if(hasF)a=a.filter(match);
    a=[...a].sort((x,y)=>sort==='top'?(y.views||0)-(x.views||0):new Date(y.created_at)-new Date(x.created_at));
    return{items:a.slice(page*PAGE,page*PAGE+PAGE),more:a.length>page*PAGE+PAGE};
  },
  async stats(){
    const rows=REMOTE?await rq('/rest/v1/scripts?select=views,game_name,icon,key_system,paid&limit=1000'):LS.get('spl_scripts',[]);
    const games={};rows.forEach(r=>{if(!r.game_name)return;const g=games[r.game_name]||(games[r.game_name]={name:r.game_name,icon:r.icon,n:0});g.n++;});
    return{scripts:rows.length,views:rows.reduce((a,r)=>a+(r.views||0),0),keyless:rows.filter(r=>!r.key_system&&!r.paid).length,games:Object.keys(games).length,top:Object.values(games).sort((a,b)=>b.n-a.n).slice(0,12)};
  },
  async get(id){
    if(REMOTE){if(!isUUID(id))return null;const r=await rq(`/rest/v1/scripts?id=eq.${encodeURIComponent(id)}&select=*`);return r[0]||null}
    return LS.get('spl_scripts',[]).find(x=>x.id===id)||null;
  },
  async mine(){
    const s=getSess();if(!s)return[];
    if(REMOTE)return rq(`/rest/v1/scripts?user_id=eq.${encodeURIComponent(s.id)}&select=id,title,game_name,icon,features,executors,key_system,paid,views,created_at&order=created_at.desc`);
    return LS.get('spl_scripts',[]).filter(x=>x.user_id===s.id).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
  },
  async save(item,id){
    const s=getSess();
    if(REMOTE){
      if(id&&!isUUID(id))throw new Error('This script is from an old demo session and cannot be edited.');
      if(id){const r=await rq(`/rest/v1/scripts?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:item,headers:{Prefer:'return=representation'}});if(!r||!r[0])throw new Error('Not allowed');return r[0]}
      const r=await rq('/rest/v1/scripts',{method:'POST',body:{...item,user_id:s.id,author:s.username},headers:{Prefer:'return=representation'}});return r[0];
    }
    const all=LS.get('spl_scripts',[]);
    if(id){const i=all.findIndex(x=>x.id===id&&x.user_id===s.id);if(i<0)throw new Error('Not allowed');all[i]={...all[i],...item};LS.set('spl_scripts',all);return all[i]}
    const n={...item,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),user_id:s.id,author:s.username,views:0,created_at:new Date().toISOString()};
    all.unshift(n);LS.set('spl_scripts',all);return n;
  },
  async remove(id){
    const s=getSess();
    if(REMOTE){await rq(`/rest/v1/scripts?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});return}
    LS.set('spl_scripts',LS.get('spl_scripts',[]).filter(x=>!(x.id===id&&x.user_id===s.id)));
  },
  async view(id){
    try{
      if(sessionStorage.getItem('v_'+id))return;sessionStorage.setItem('v_'+id,'1');
      if(REMOTE){await rq('/rest/v1/rpc/increment_views',{method:'POST',body:{sid:id}});return}
      const all=LS.get('spl_scripts',[]),i=all.findIndex(x=>x.id===id);if(i>=0){all[i].views=(all[i].views||0)+1;LS.set('spl_scripts',all)}
    }catch(e){}
  },
  async likes(id){
    if(REMOTE){const r=await rq(`/rest/v1/script_likes?script_id=eq.${encodeURIComponent(id)}&select=user_id&limit=10000`);return r.map(x=>x.user_id)}
    return LS.get('spl_likes',{})[id]||[];
  },
  async like(id){
    const s=getSess();
    if(REMOTE){await rq('/rest/v1/script_likes',{method:'POST',body:{script_id:id,user_id:s.id,author:s.username},headers:{Prefer:'return=minimal'}});return}
    const all=LS.get('spl_likes',{}),a=all[id]||[];if(!a.includes(s.id))a.push(s.id);all[id]=a;LS.set('spl_likes',all);
    const meta=LS.get('spl_likemeta',[]).filter(m=>!(m.script_id===id&&m.user_id===s.id));meta.push({script_id:id,user_id:s.id,author:s.username,created_at:new Date().toISOString()});LS.set('spl_likemeta',meta);
  },
  async unlike(id){
    const s=getSess();
    if(REMOTE){await rq(`/rest/v1/script_likes?script_id=eq.${encodeURIComponent(id)}&user_id=eq.${encodeURIComponent(s.id)}`,{method:'DELETE'});return}
    const all=LS.get('spl_likes',{});all[id]=(all[id]||[]).filter(x=>x!==s.id);LS.set('spl_likes',all);
    LS.set('spl_likemeta',LS.get('spl_likemeta',[]).filter(m=>!(m.script_id===id&&m.user_id===s.id)));
  },
  async notifs(){
    const s=getSess();if(!s)return[];
    const mine=await DB.mine();
    const ids=mine.map(x=>x.id),titles={};
    mine.forEach(x=>titles[x.id]=x.title);
    let likes=[],coms=[],reps=[];
    if(REMOTE){
      const me=encodeURIComponent(s.id),jobs=[rq(`/rest/v1/script_comments?user_id=eq.${me}&select=id&limit=500`)];
      if(ids.length){
        const list=ids.map(encodeURIComponent).join(',');
        jobs.push(
          rq(`/rest/v1/script_likes?script_id=in.(${list})&user_id=neq.${me}&select=script_id,user_id,author,created_at&order=created_at.desc&limit=50`),
          rq(`/rest/v1/script_comments?script_id=in.(${list})&user_id=neq.${me}&select=id,script_id,user_id,author,body,created_at&order=created_at.desc&limit=50`)
        );
      }
      const res=await Promise.all(jobs),myC=res[0];
      if(ids.length){likes=res[1];coms=res[2]}
      if(myC.length)reps=await rq(`/rest/v1/script_comments?parent_id=in.(${myC.map(x=>encodeURIComponent(x.id)).join(',')})&user_id=neq.${me}&select=id,script_id,user_id,author,body,created_at&order=created_at.desc&limit=50`);
      const missing=[...new Set(reps.map(r=>r.script_id))].filter(i=>!(i in titles));
      if(missing.length){try{const t=await rq(`/rest/v1/scripts?id=in.(${missing.map(encodeURIComponent).join(',')})&select=id,title`);t.forEach(x=>titles[x.id]=x.title)}catch(e){}}
    }else{
      const cs=LS.get('spl_comments',[]),myIds=cs.filter(c=>c.user_id===s.id).map(c=>c.id);
      likes=LS.get('spl_likemeta',[]).filter(l=>ids.includes(l.script_id)&&l.user_id!==s.id);
      coms=cs.filter(c=>ids.includes(c.script_id)&&c.user_id!==s.id);
      reps=cs.filter(c=>myIds.includes(c.parent_id)&&c.user_id!==s.id);
      const all=LS.get('spl_scripts',[]);
      reps.forEach(r=>{if(!(r.script_id in titles)){const x=all.find(y=>y.id===r.script_id);if(x)titles[x.id]=x.title}});
    }
    const repIds=new Set(reps.map(r=>r.id));
    const out=[
      ...likes.map(l=>({type:'like',script_id:l.script_id,user_id:l.user_id,author:l.author||'Someone',created_at:l.created_at,title:titles[l.script_id]})),
      ...coms.filter(c=>!repIds.has(c.id)).map(c=>({type:'comment',script_id:c.script_id,user_id:c.user_id,author:c.author,body:c.body,created_at:c.created_at,title:titles[c.script_id]})),
      ...reps.map(c=>({type:'reply',script_id:c.script_id,user_id:c.user_id,author:c.author,body:c.body,created_at:c.created_at,title:titles[c.script_id]}))
    ];
    return out.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,30);
  },
  async comments(id){

  },

  },
  async removeComment(id){

    if(REMOTE){await rq(`/rest/v1/script_comments?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});return}

  }

function ask(title,text,label='Delete'){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='mo';
    o.innerHTML=`<div class="md" role="dialog" aria-modal="true"><div class="mic">${ICON_TRASH}</div><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="mbtn"><button type="button" class="btn sec" data-r="0">Cancel</button><button type="button" class="btn danger" data-r="1">${esc(label)}</button></div></div>`;
    const done=v=>{o.remove();res(v)};
    o.onclick=e=>{if(e.target===o)done(false)};
    o.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>done(b.dataset.r==='1'));
    document.body.appendChild(o);
    o.querySelector('[data-r="0"]').focus();

async function initLikes(it){
  const btn=$('lkBtn');if(!btn)return;
  let liked=false,count=0,busy=false;
  const paint=()=>{const b=$('lkBtn');if(!b)return;b.classList.toggle('on',liked);b.querySelector('.n').textContent=fmt(count);b.setAttribute('aria-pressed',String(liked))};
  try{
    const l=await DB.likes(it.id),s=getSess();
    count=l.length;liked=!!s&&l.includes(s.id);
  }catch(e){}
  paint();
  btn.onclick=async()=>{
    if(!getSess()){toast('Log in to like scripts',1);return}

      else{await DB.like(it.id);liked=true;count++}
      paint();
    }catch(e){toast(e.message,1)}

  };
}

async function initComments(it){
  const form=$('cmForm');if(!form)return;
  const s=getSess();
  const COOLDOWN=10*60*1000,RCOOLDOWN=60*1000;
  let list=[],profs={},posting=false,last=s?LS.get('spl_cm_'+s.id,0):0,lastR=s?LS.get('spl_rp_'+s.id,0):0;
  if(s){
    form.innerHTML=`<div class="cmform"><textarea id="cmIn" maxlength="500" placeholder="Write a comment..."></textarea><div class="cmfoot"><span class="hint" id="cmN">0 / 500</span><button type="button" class="btn" id="cmPost">Post comment</button></div><div id="cmMsg"></div></div>`;
    $('cmIn').addEventListener('input',()=>{$('cmN').textContent=$('cmIn').value.length+' / 500'});
    $('cmPost').onclick=async()=>{
      const v=$('cmIn').value.trim(),m=$('cmMsg');
      if(!v){m.innerHTML='<div class="err">Write something first.</div>';return}
      if(posting)return;
      const wait=COOLDOWN-(Date.now()-last);
      if(wait>0){m.innerHTML=`<div class="err">Cooldown active. You can comment again in ${Math.ceil(wait/60000)} min.</div>`;return}
      posting=true;$('cmPost').disabled=true;m.innerHTML='';

    };

  }

    if(!getSess()){toast('Log in to reply',1);return}
    document.querySelectorAll('.rform').forEach(f=>{f.innerHTML=''});
    const box=$('rf-'+pid);if(!box)return;
    box.innerHTML=`<textarea maxlength="500" id="rIn" placeholder="Write a reply...">${esc(prefill)}</textarea><div class="cmfoot"><span class="hint" id="rN">${prefill.length} / 500</span><div class="rbtns"><button type="button" class="btn sec" id="rCancel">Cancel</button><button type="button" class="btn" id="rPost">Reply</button></div></div><div id="rMsg"></div>`;
    const inp=$('rIn');
    inp.addEventListener('input',()=>{$('rN').textContent=inp.value.length+' / 500'});
    $('rCancel').onclick=()=>{box.innerHTML=''};
    $('rPost').onclick=async()=>{
      const v=inp.value.trim(),m=$('rMsg');
      if(!v){m.innerHTML='<div class="err">Write something first.</div>';return}
      if(posting)return;
      const wait=RCOOLDOWN-(Date.now()-lastR);
      if(wait>0){m.innerHTML=`<div class="err">Slow down. You can reply again in ${Math.ceil(wait/1000)} s.</div>`;return}
      posting=true;$('rPost').disabled=true;m.innerHTML='';
      try{
        const c=await DB.addComment(it.id,v,pid);
        lastR=Date.now();
        LS.set('spl_rp_'+getSess().id,lastR);
        const cur=getSess();
        if(cur&&cur.profile)profs[cur.id]=cur.profile;
        list.push(c);
        draw();
      }catch(e){if($('rMsg'))$('rMsg').innerHTML=`<div class="err">${esc(e.message)}</div>`;if($('rPost'))$('rPost').disabled=false}
      posting=false;
    };
    inp.focus();
    inp.setSelectionRange(inp.value.length,inp.value.length);
  };
  const draw=()=>{
    const box=$('cmList');if(!box)return;

    const kids={};
    list.filter(c=>c.parent_id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(c=>{(kids[c.parent_id]||(kids[c.parent_id]=[])).push(c)});
    const cur=getSess();

      const reply=!!top,pid=reply?top.id:c.id,can=cur&&(cur.id===c.user_id||cur.id===OWNER_ID),k=reply?[]:(kids[c.id]||[]);
      return `<div class="cm${reply?' rp':''}">${avatarHTML(profs[c.user_id],c.author,reply?28:36)}<div class="cb"><div class="ch"><b>${esc(c.author)}</b>${ownerTag(c.user_id)}<small>${esc(timeAgo(c.created_at))}</small>${can?`<button type="button" class="dn" data-d="${esc(c.id)}">Delete</button>`:''}</div><div class="ct">${esc(c.body)}</div><div class="cact"><button type="button" data-p="${esc(pid)}" data-n="${reply?esc(c.author):''}">Reply${k.length?` (${k.length})`:''}</button></div>${k.length?`<div class="reps">${k.map(x=>one(x,c)).join('')}</div>`:''}${reply?'':`<div class="rform" id="rf-${esc(c.id)}"></div>`}</div></div>`;
    };
    box.innerHTML=tops.map(c=>one(c,null)).join('');
    box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openForm(b.dataset.p,b.dataset.n?'@'+b.dataset.n+' ':''));
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.d,hasKids=list.some(x=>x.parent_id===id);

      try{await DB.removeComment(id);list=list.filter(x=>x.id!==id&&x.parent_id!==id);draw();toast('Comment deleted')}catch(e){toast(e.message,1)}
    });
  };
  try{
    list=await DB.comments(it.id);
    if(!$('cmList'))return;
    draw();
    profs=await Prof.many([...new Set(list.map(c=>c.user_id))]);
    draw();
  }catch(e){
    if($('cmList'))$('cmList').innerHTML=`<p class="err">Could not load comments: ${esc(e.message)}</p>`;
  }
}

async function search(v){
  const seq=++searchSeq,res=$('results'),err=$('gameErr'),spin=$('spin');if(!res)return;
  err.textContent='';spin.classList.remove('hidden');
  try{
    const m=v.match(/roblox\.com\/(?:[a-z-]+\/)?games\/(\d+)/i),pid=m?m[1]:(/^\d{5,}$/.test(v)?v:null);
    const map=g=>({universeId:g.id,name:g.name,placeId:g.rootPlaceId,playing:g.playing,visits:g.visits});
    let list=[];
    if(pid){
      const u=await getJSON(`${PROXY.apis}/universes/v1/places/${pid}/universe`);
      if(!u.universeId)throw new Error('Place ID not found');
      list=(await getJSON(`${PROXY.games}/v1/games?universeIds=${u.universeId}`)).data.map(map);
    }else{
      const d=await getJSON(`${PROXY.apis}/search-api/omni-search?searchQuery=${encodeURIComponent(v)}&sessionId=${crypto.randomUUID()}&pageType=all`);
      const games=[];(d.searchResults||[]).forEach(r=>{if(r.contentGroupType==='Game')(r.contents||[]).forEach(c=>games.push(c))});
      const ids=games.slice(0,10).map(g=>g.universeId);
      if(!ids.length)throw new Error('No games found for "'+v+'"');
      list=(await getJSON(`${PROXY.games}/v1/games?universeIds=${ids.join(',')}`)).data.map(map);
    }
    const ic=await icons(list.map(g=>g.universeId));
    if(seq!==searchSeq)return;
    list.forEach(g=>g.icon=ic[g.universeId]||'');
    res.innerHTML='';
    list.forEach(g=>{
      const d=document.createElement('div');d.className='game';
      d.innerHTML=`<img src="${esc(g.icon)}" alt=""><div><b>${esc(g.name)}</b><small>${fmt(g.playing)} playing, ${fmt(g.visits)} visits</small></div>`;
      d.onclick=()=>pickGame(g);res.appendChild(d);
    });
  }catch(e){if(seq===searchSeq){res.innerHTML='';err.textContent=e.message}}
  if(seq===searchSeq&&$('spin'))$('spin').classList.add('hidden');
}

const Prof={
  async load(id){
    if(!id)return{};
    if(REMOTE){try{const r=await rq(`/rest/v1/profiles?id=eq.${encodeURIComponent(id)}&select=avatar,bio,link,color`);return r[0]||{}}catch(e){return{}}}
    const u=LS.get('spl_users',{})[id];
    return u?{avatar:u.avatar||'',bio:u.bio||'',link:u.link||'',color:u.color||''}:{};
  },
  async many(ids){
    const out={};
    if(!ids.length)return out;
    if(REMOTE){
      const ok=ids.filter(isUUID);
      if(!ok.length)return out;
      try{const r=await rq(`/rest/v1/profiles?id=in.(${ok.map(encodeURIComponent).join(',')})&select=id,avatar,color`);r.forEach(p=>out[p.id]=p)}catch(e){}
      return out;
    }
    const all=LS.get('spl_users',{});
    ids.forEach(id=>{const u=all[id];if(u)out[id]={avatar:u.avatar||'',color:u.color||''}});
    return out;
  },
  async sync(){
    const s=getSess();if(!s)return{};
    const p=await Prof.load(s.id);
    let created=s.created;
    try{if(REMOTE){const u=await rq('/auth/v1/user');created=u.created_at}else{const u=LS.get('spl_users',{})[s.id];if(u)created=u.created}}catch(e){}
    LS.set('spl_sess',{...getSess(),profile:p,created});
    headerSync();
    return p;
  },
  async save(p){
    const s=getSess();
    if(REMOTE){await rq('/rest/v1/profiles?on_conflict=id',{method:'POST',body:{id:s.id,...p},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}})}
    else{const all=LS.get('spl_users',{});if(!all[s.id])throw new Error('Account not found');Object.assign(all[s.id],p);LS.set('spl_users',all)}
    LS.set('spl_sess',{...getSess(),profile:p});
    headerSync();
  }
};
function readAvatar(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type))return rej(new Error('Choose a PNG, JPG or WebP image.'));
    if(file.size>8*1024*1024)return rej(new Error('That image is larger than 8 MB.'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const S=192,c=document.createElement('canvas');c.width=c.height=S;
      const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
      c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,S,S);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read this image.'))};
    im.src=url;
  });
}
const onAccount=()=>(location.hash.slice(1)||'home').split('/')[0]==='account';

    $('app').innerHTML='<div class="sk" style="height:240px"></div>';
    let mine=[];
    try{await Prof.sync()}catch(e){}
    try{mine=await DB.mine()}catch(e){}
    if(!onAccount())return;
    renderProfile(mine);
    return;
  }
  if(REMOTE){
    $('app').innerHTML=`<div class="join"><h1>Log in with Discord</h1><p>No password needed. Publish scripts, track views and manage everything in one place.</p></div>
    <div class="card" style="max-width:420px;margin-top:16px"><button class="btn" id="dcBtn" style="width:100%;background:#5865F2">Continue with Discord</button><div id="lmsg"></div></div>`;
    $('dcBtn').onclick=()=>Auth.discord();
    return;
  }
  $('app').innerHTML=`<div class="join"><h1>Create your account</h1><p>Free. Publish scripts, track views and manage everything in one place.</p></div>
    <div class="grid2 eq" style="margin-top:16px">
    <div class="card"><h2>Login</h2><label>Email</label><input id="le" type="email"><label>Password</label><input type="password" id="lp">
      <div class="actions"><button class="btn" id="loginBtn">Login</button></div><div id="lmsg"></div></div>
    <div class="card"><h2>Register</h2><label>Email</label><input id="re" type="email"><label>Username (3-20 letters, numbers, _)</label><input id="ru"><label>Password (min. 8 characters)</label><input type="password" id="rp">
      <div class="actions"><button class="btn" id="regBtn">Register</button></div><div id="rmsg"></div></div></div>
    ${REMOTE?'':'<p class="hint" style="margin-top:14px">Demo mode: accounts exist only in this browser.</p>'}`;
  $('loginBtn').onclick=async()=>{try{await Auth.login($('le').value.trim(),$('lp').value);try{await Prof.sync()}catch(e){}toast('Welcome back');go('home');route()}catch(e){$('lmsg').innerHTML=`<div class="err">${esc(e.message)}</div>`}};
  $('regBtn').onclick=async()=>{
    const e=$('re').value.trim(),u=$('ru').value.trim(),p=$('rp').value,m=$('rmsg');
    if(!/^\S+@\S+\.\S+$/.test(e)){m.innerHTML='<div class="err">Enter a valid email.</div>';return}
    if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){m.innerHTML='<div class="err">Invalid username.</div>';return}
    if(p.length<8){m.innerHTML='<div class="err">Password too short.</div>';return}
    try{const r=await Auth.register(e,u,p);if(r==='confirm'){m.innerHTML='<div class="good">Account created. Check your email to confirm, then log in.</div>';return}try{await Prof.sync()}catch(x){}toast('Account created');go('home');route()}catch(er){m.innerHTML=`<div class="err">${esc(er.message)}</div>`}};
}
function renderProfile(mine){
  const s=getSess(),p=s.profile||{},views=mine.reduce((a,x)=>a+(x.views||0),0);
  const since=s.created?new Date(s.created).toLocaleDateString('en-US',{month:'short',year:'numeric'}):'-';
  const work={avatar:dataImg(p.avatar),color:AV_COLORS.includes(p.color)?p.color:AV_COLORS[0]};
  const plink=safeUrl(p.link);
  $('app').innerHTML=`
  <section class="prof"><div class="pban" id="pBan"></div><div class="pbody"><div id="pAv"></div>
    <div class="pinfo"><h1>${esc(s.username)}${ownerTag(s.id)}</h1><span class="hint" style="margin:0">${esc(s.email)}</span><p class="pbio" id="pBio">${esc(p.bio||'')}</p>${plink?`<a class="plink" id="pLink" href="${esc(plink)}" target="_blank" rel="noopener noreferrer">Community link</a>`:''}</div>
    <div class="pstats"><div><b>${mine.length}</b><span>Scripts</span></div><div><b>${fmt(views)}</b><span>Views</span></div><div><b>${esc(since)}</b><span>Member since</span></div></div></div></section>
  <div class="grid2 eq">
    <div class="card"><h2>Edit profile</h2>
      <div class="aved"><button type="button" class="avbtn" id="upBtn" aria-label="Change photo"><span id="eAv"></span><span class="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>
        <div class="avtxt"><b>Profile photo</b><p class="hint">PNG, JPG or WebP. Cropped to a square.</p><div class="avact"><button type="button" class="lnk up" id="upLink">Upload new</button><button type="button" class="lnk dn hidden" id="rmBtn">Remove</button></div></div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"></div>
      <label>Accent color</label><div class="swatches" id="sw"></div>
      <label>Bio</label><textarea id="bio" maxlength="160" style="min-height:80px;font-family:inherit" placeholder="What do you make?"></textarea><div class="hint" id="bioN"></div>
      <label>Community link (https)</label><input id="plinkIn" placeholder="https://discord.gg/...">
      <div class="actions"><button class="btn" id="saveP">Save profile</button></div><div id="pmsg"></div></div>
    <div style="display:grid;gap:18px">
      ${REMOTE?'':`<div class="card"><h2>Change password</h2>
        <label>Current password</label><input type="password" id="op">
        <label>New password (min. 8 characters)</label><input type="password" id="np">
        <div class="actions"><button class="btn" id="cp">Update password</button></div><div id="msg"></div></div>`}
      <div class="card"><h2>Session</h2><div class="actions" style="margin-top:0"><button class="btn danger" id="logout">Log out</button></div></div>
    </div></div>
  <section class="mysec"><div class="rowh"><h2>Your scripts <span class="cnt">${mine.length}</span></h2><div class="rowact"><div class="seg2" id="mSort"><button data-v="new">Newest</button><button data-v="top">Most viewed</button></div><a class="btn" href="#publish" id="newBtn2">New script</a></div></div><div class="feed" id="myFeed"></div></section>`;
  $('bio').value=p.bio||'';$('plinkIn').value=p.link||'';
  const paint=()=>{
    $('pBan').style.background=work.color;
    $('pAv').innerHTML=avatarHTML(work,s.username,88);
    $('eAv').innerHTML=avatarHTML(work,s.username,80);
    $('rmBtn').classList.toggle('hidden',!work.avatar);
    $('sw').innerHTML=AV_COLORS.map(c=>`<button type="button" class="${c===work.color?'on':''}" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('');
    $('sw').querySelectorAll('button').forEach(b=>b.onclick=()=>{work.color=b.dataset.c;paint()});
    $('bioN').textContent=$('bio').value.length+' / 160';
  };
  paint();
  $('bio').addEventListener('input',()=>{$('bioN').textContent=$('bio').value.length+' / 160';$('pBio').textContent=$('bio').value});
  $('upBtn').onclick=()=>$('file').click();
  $('upLink').onclick=()=>$('file').click();
  $('file').onchange=async()=>{
    const f=$('file').files[0];if(!f)return;
    try{work.avatar=await readAvatar(f);paint()}catch(e){toast(e.message,1)}
    $('file').value='';
  };
  $('rmBtn').onclick=()=>{work.avatar='';paint()};
  $('saveP').onclick=async()=>{
    const link=$('plinkIn').value.trim(),m=$('pmsg');
    if(link&&!safeUrl(link)){m.innerHTML='<div class="err">The link must start with https://</div>';return}
    $('saveP').disabled=true;
    try{
      await Prof.save({avatar:work.avatar,color:work.color,bio:$('bio').value.trim().slice(0,160),link});
      m.innerHTML='';toast('Profile saved');renderProfile(mine);
    }catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`}
    $('saveP').disabled=false;
  };
  let mSort='new';
  const drawMine=()=>{
    document.querySelectorAll('#mSort button').forEach(b=>b.classList.toggle('on',b.dataset.v===mSort));
    const list=[...mine].sort((x,y)=>mSort==='top'?(y.views||0)-(x.views||0):new Date(y.created_at)-new Date(x.created_at)),box=$('myFeed');
    if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>Nothing published yet</h3>Your scripts will show up here.<div class="actions" style="justify-content:center"><a class="btn" href="#publish">Publish a script</a></div></div>';return}
    box.innerHTML=list.map(it=>`<div class="mc">${cardHTML({...it,author:s.username,user_id:s.id})}<div class="mcact"><button type="button" class="btn sec" data-e="${esc(it.id)}">Edit</button><button type="button" class="btn danger" data-d="${esc(it.id)}">Delete</button></div></div>`).join('');
    box.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{
      try{
        const it=await DB.get(b.dataset.e);if(!it)throw new Error('Script not found');
        draft={game:it.game_name?{name:it.game_name,placeId:it.place_id,universeId:it.universe_id,icon:it.icon}:null,features:it.features||[],title:it.title,description:it.description||'',code:it.code,link:it.link||'',access:it.paid?'paid':(it.key_system?'key':'free'),executors:it.executors||[],editId:it.id,rules:true};
        saveDraft();go('publish');
      }catch(e){toast(e.message,1)}
    });
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
      if(!await ask('Delete this script?','This permanently removes the script together with its likes and comments.'))return;
      try{await DB.remove(b.dataset.d);toast('Script deleted');pageAccount()}catch(e){toast(e.message,1)}
    });
  };
  document.querySelectorAll('#mSort button').forEach(b=>b.onclick=()=>{mSort=b.dataset.v;drawMine()});
  $('newBtn2').onclick=()=>{draft=fresh();saveDraft()};
  drawMine();
  $('logout').onclick=()=>{Auth.logout();toast('Logged out');route()};
  if($('cp'))$('cp').onclick=async()=>{
    if($('np').value.length<8){$('msg').innerHTML='<div class="err">New password is too short.</div>';return}
    try{await Auth.changePassword(REMOTE?'':$('op').value,$('np').value);$('msg').innerHTML='<div class="good">Password updated.</div>'}catch(e){$('msg').innerHTML=`<div class="err">${esc(e.message)}</div>`}
  };
}
async function oauthReturn(){
  const qs=new URLSearchParams(location.search),hs=new URLSearchParams(location.hash.slice(1));
  const hasTok=hs.get('access_token'),errMsg=hs.get('error_description')||qs.get('error_description');
  if(!hasTok&&!errMsg)return;
  history.replaceState(null,'',location.pathname+'#home');
  if(errMsg){toast(errMsg.replace(/\+/g,' '),1);return}
  try{
    const token=hs.get('access_token'),refresh=hs.get('refresh_token');
    const r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/user',{headers:{apikey:CFG.SUPABASE_ANON_KEY,Authorization:'Bearer '+token}});
    if(!r.ok)throw new Error('Login failed');
    const u=await r.json();
    LS.set('spl_sess',sessFrom({user:u,access_token:token,refresh_token:refresh}));
    try{await Prof.sync()}catch(e){}
    toast('Logged in');
  }catch(e){toast(e.message,1)}
}
oauthReturn().finally(route);
</script>
