const PROXY={games:'https://games.roproxy.com',apis:'https://apis.roproxy.com',thumbs:'https://thumbnails.roproxy.com'};

const TIERS=[[1000000,'Famous Creator','t4'],[500000,'Popular Creator','t3'],[100000,'Very Good Creator','t2'],[10000,'Good Creator','t1']];
const ICON_VERIFIED='<svg class="vf" viewBox="0 0 24 24" role="img" aria-label="Verified"><title>Verified</title><path d="M12 1.8l2.5 1.8 3.1-.1 1 2.9 2.6 1.8-.9 3 .9 3-2.6 1.8-1 2.9-3.1-.1-2.5 1.8-2.5-1.8-3.1.1-1-2.9-2.6-1.8.9-3-.9-3 2.6-1.8 1-2.9 3.1.1z" fill="currentColor"/><path d="M8 12.3l2.7 2.7L16.2 9.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const ICON_DENY=svgI('<path d="M18 6L6 18M6 6l12 12"/>');
const ICON_SHIELD=svgI('<path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6z"/>');
const ICON_TAG=svgI('<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/>');
const ICON_TIER={
  t1:svgI('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'),
  t2:svgI('<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/>'),
  t3:svgI('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'),
  t4:svgI('<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/><path d="M5 20h14"/>')
};
const ICON_FLAG=svgI('<path d="M5 22V4M5 4h12l-2 4 2 4H5"/>');
const VERIFY_WAIT=10*60000;
const REPORT_REASONS=['Malicious or harmful code','Stolen script','Scam or fake','Inappropriate content','Other'];
const ICON_MAIL=svgI('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>');
const ICON_CLOCK=svgI('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>');
const TIMEOUT_OPTS=[[10,'10 minutes'],[60,'1 hour'],[1440,'1 day'],[10080,'7 days'],[43200,'30 days']];
const UB={},NAMES={};
const tierOf=v=>TIERS.find(t=>v>=t[0])||null;
function badgeHTML(id){
  const u=UB[id];if(!u)return '';
  const t=u.tier?TIERS.find(x=>x[2]===u.tier)||null:tierOf(u.views);
  return (u.verified?ICON_VERIFIED:'')+(t?`<span class="ctag ${t[2]}">${ICON_TIER[t[2]]}${esc(t[1])}</span>`:'')+(u.tag?`<span class="ctag tc">${ICON_TAG}${esc(u.tag)}</span>`:'');
}
const ownerTag=id=>(id===OWNER_ID?`<span class="owner">${ICON_SHIELD}Owner</span>`:'')+badgeHTML(id);
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//i.test(u||'')?u:'';
const go=p=>{location.hash=p};
const getSess=()=>LS.get('spl_sess',null);
const fmt=n=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};
function timeAgo(d){
  if(!d)return 'just now';
  const s=(Date.now()-new Date(d).getTime())/1000;
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+'min ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<2592000)return Math.floor(s/86400)+'d ago';
  return new Date(d).toLocaleDateString('en-US');
}
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2600)}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function copy(t,label){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(label||'Copied to clipboard')}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function icons(ids){if(!ids.length)return{};try{const d=await getJSON(`${PROXY.thumbs}/v1/games/icons?universeIds=${ids.join(',')}&size=256x256&format=Png&isCircular=false`);const m={};d.data.forEach(x=>m[x.targetId]=x.imageUrl);return m}catch(e){return{}}}
const fresh=()=>({game:null,features:['Auto Farm'],title:'',description:'',code:'',link:'',access:'free',executors:[],editId:null,rules:false});
let draft=fresh();
const saveDraft=()=>{};try{localStorage.removeItem('spl_draft')}catch(e){}
const isUUID=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v||'');
if(REMOTE){
  const _s=getSess();if(_s&&!_s.token)LS.set('spl_sess',null);
  if(draft.editId&&!isUUID(draft.editId)){draft=fresh();saveDraft()}
  if(location.hash.startsWith('#script/')&&!isUUID(location.hash.slice(8)))location.hash='home';
}

async function rq(path,{method='GET',body,headers={},auth=true,retry=true}={}){
  const s=getSess();
  const h={apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json',Authorization:'Bearer '+((auth&&s&&s.token)||CFG.SUPABASE_ANON_KEY),...headers};
  const r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401&&retry&&auth&&s&&s.refresh&&await refreshTok())return rq(path,{method,body,headers,auth,retry:false});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.msg||j.message||j.error_description||j.error||m}catch(e){}throw new Error(m)}
  const t=await r.text();return t?JSON.parse(t):null;
}
async function refreshTok(){const s=getSess();try{const j=await rq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh},auth:false,retry:false});LS.set('spl_sess',{...s,token:j.access_token,refresh:j.refresh_token});return true}catch(e){LS.set('spl_sess',null);return false}}
const sessFrom=j=>{const m=j.user.user_metadata||{},em=j.user.email||'';return{id:j.user.id,email:em,username:String(m.username||(m.custom_claims&&m.custom_claims.global_name)||m.full_name||m.name||m.preferred_username||em.split('@')[0]||'user').slice(0,30),created:j.user.created_at,token:j.access_token,refresh:j.refresh_token}};

const Auth={
  async register(email,username,password){
    if(REMOTE){
      const j=await rq('/auth/v1/signup',{method:'POST',body:{email,password,data:{username}},auth:false});
      if(j&&j.access_token){LS.set('spl_sess',sessFrom(j));return 'ok'}
      return 'confirm';
    }
    const all=LS.get('spl_users',{}),k=email.toLowerCase();
    if(all[k])throw new Error('Email already registered');
    if(Object.values(all).some(u=>u.username.toLowerCase()===username.toLowerCase()))throw new Error('Username already taken');
    const salt=crypto.randomUUID();all[k]={email:k,username,salt,hash:await sha(salt+password),created:Date.now()};
    LS.set('spl_users',all);LS.set('spl_sess',{id:k,email:k,username,created:all[k].created});return 'ok';
  },
  async login(email,password){
    if(REMOTE){const j=await rq('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false});LS.set('spl_sess',sessFrom(j));return}
    const u=LS.get('spl_users',{})[email.toLowerCase()];
    if(!u||await sha(u.salt+password)!==u.hash)throw new Error('Wrong email or password');
    LS.set('spl_sess',{id:u.email,email:u.email,username:u.username,created:u.created});
  },
  discord(){location.href=CFG.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/authorize?provider=discord&redirect_to='+encodeURIComponent(location.origin+location.pathname)},
  logout(){LS.set('spl_sess',null);draft=fresh()},
  async changePassword(oldP,newP){
    if(REMOTE){await rq('/auth/v1/user',{method:'PUT',body:{password:newP}});return}
    const s=getSess(),all=LS.get('spl_users',{}),u=all[s.id];
    if(await sha(u.salt+oldP)!==u.hash)throw new Error('Current password is wrong');
    u.salt=crypto.randomUUID();u.hash=await sha(u.salt+newP);LS.set('spl_users',all);
  }
};

const DB={
  async list({q='',sort='new',page=0,key='all',features=[],executor=''}){
    const hasF=features.length>0||!!executor;
    const match=x=>features.every(f=>(x.features||[]).includes(f))&&(!executor||(x.executors||[]).includes(executor));
    const keyOk=x=>key==='all'||(key==='no'&&!x.key_system&&!x.paid)||(key==='yes'&&!!x.key_system)||(key==='paid'&&!!x.paid);
    if(REMOTE){
      let p=`/rest/v1/scripts?select=id,user_id,title,game_name,icon,features,executors,key_system,paid,views,author,created_at&order=${sort==='top'?'views.desc':'created_at.desc'}`;
      p+=hasF?'&limit=400':`&limit=${PAGE+1}&offset=${page*PAGE}`;
      const c=q.replace(/[,()*%]/g,' ').trim();
      if(c)p+=`&or=(title.ilike.*${encodeURIComponent(c)}*,game_name.ilike.*${encodeURIComponent(c)}*)`;
      if(key==='no')p+='&key_system=eq.false&paid=eq.false';
      if(key==='yes')p+='&key_system=eq.true';
      if(key==='paid')p+='&paid=eq.true';
      let rows=await rq(p);
      if(hasF){rows=rows.filter(match);return{items:rows.slice(page*PAGE,page*PAGE+PAGE),more:rows.length>page*PAGE+PAGE}}
      return{items:rows.slice(0,PAGE),more:rows.length>PAGE};
    }
    let a=LS.get('spl_scripts',[]);const c=q.toLowerCase().trim();
    if(c)a=a.filter(x=>(x.title+' '+(x.game_name||'')).toLowerCase().includes(c));
    a=a.filter(keyOk);
    if(hasF)a=a.filter(match);
    a=[...a].sort((x,y)=>sort==='top'?(y.views||0)-(x.views||0):new Date(y.created_at)-new Date(x.created_at));
    return{items:a.slice(page*PAGE,page*PAGE+PAGE),more:a.length>page*PAGE+PAGE};
  },
  async stats(){
    const rows=REMOTE?await rq('/rest/v1/scripts?select=views,game_name,icon,key_system,paid&limit=1000'):LS.get('spl_scripts',[]);
    const games={};rows.forEach(r=>{if(!r.game_name)return;const g=games[r.game_name]||(games[r.game_name]={name:r.game_name,icon:r.icon,n:0});g.n++;});
    return{scripts:rows.length,views:rows.reduce((a,r)=>a+(r.views||0),0),keyless:rows.filter(r=>!r.key_system&&!r.paid).length,games:Object.keys(games).length,top:Object.values(games).sort((a,b)=>b.n-a.n).slice(0,12)};
  },
  async get(id){
    if(REMOTE){if(!isUUID(id))return null;const r=await rq(`/rest/v1/scripts?id=eq.${encodeURIComponent(id)}&select=*`);return r[0]||null}
    return LS.get('spl_scripts',[]).find(x=>x.id===id)||null;
  },
  async mine(){
    const s=getSess();if(!s)return[];
    if(REMOTE)return rq(`/rest/v1/scripts?user_id=eq.${encodeURIComponent(s.id)}&select=id,title,game_name,icon,features,executors,key_system,paid,views,created_at&order=created_at.desc`);
    return LS.get('spl_scripts',[]).filter(x=>x.user_id===s.id).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
  },
  async byUser(id){
    if(REMOTE){
      if(!isUUID(id))return[];
      return rq(`/rest/v1/scripts?user_id=eq.${encodeURIComponent(id)}&select=id,user_id,title,game_name,icon,features,executors,key_system,paid,views,author,created_at&order=created_at.desc&limit=200`);
    }
    return LS.get('spl_scripts',[]).filter(x=>x.user_id===id).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
  },
  async save(item,id){
    const s=getSess();
    if(REMOTE){
      if(id&&!isUUID(id))throw new Error('This script is from an old demo session and cannot be edited.');
      if(id){const r=await rq(`/rest/v1/scripts?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:item,headers:{Prefer:'return=representation'}});if(!r||!r[0])throw new Error('Not allowed');return r[0]}
      await Timeout.guard();
      const r=await rq('/rest/v1/scripts',{method:'POST',body:{...item,user_id:s.id,author:s.username},headers:{Prefer:'return=representation'}});return r[0];
    }
    const all=LS.get('spl_scripts',[]);
    if(id){const i=all.findIndex(x=>x.id===id&&x.user_id===s.id);if(i<0)throw new Error('Not allowed');all[i]={...all[i],...item};LS.set('spl_scripts',all);return all[i]}
    const n={...item,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),user_id:s.id,author:s.username,views:0,created_at:new Date().toISOString()};
    all.unshift(n);LS.set('spl_scripts',all);return n;
  },
  async remove(id){
    const s=getSess();
    if(REMOTE){await rq(`/rest/v1/scripts?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});return}
    LS.set('spl_scripts',LS.get('spl_scripts',[]).filter(x=>!(x.id===id&&x.user_id===s.id)));
  },
  async view(id){
    try{
      if(sessionStorage.getItem('v_'+id))return;sessionStorage.setItem('v_'+id,'1');
      if(REMOTE){await rq('/rest/v1/rpc/increment_views',{method:'POST',body:{sid:id}});return}
      const all=LS.get('spl_scripts',[]),i=all.findIndex(x=>x.id===id);if(i>=0){all[i].views=(all[i].views||0)+1;LS.set('spl_scripts',all)}
    }catch(e){}
  },
  async likes(id){
    if(REMOTE){const r=await rq(`/rest/v1/script_likes?script_id=eq.${encodeURIComponent(id)}&select=user_id&limit=10000`);return r.map(x=>x.user_id)}
    return LS.get('spl_likes',{})[id]||[];
  },
  async like(id){
    const s=getSess();
    if(REMOTE){await rq('/rest/v1/script_likes',{method:'POST',body:{script_id:id,user_id:s.id,author:s.username},headers:{Prefer:'return=minimal'}});return}
    const all=LS.get('spl_likes',{}),a=all[id]||[];if(!a.includes(s.id))a.push(s.id);all[id]=a;LS.set('spl_likes',all);
    const meta=LS.get('spl_likemeta',[]).filter(m=>!(m.script_id===id&&m.user_id===s.id));meta.push({script_id:id,user_id:s.id,author:s.username,created_at:new Date().toISOString()});LS.set('spl_likemeta',meta);
  },
  async unlike(id){
    const s=getSess();
    if(REMOTE){await rq(`/rest/v1/script_likes?script_id=eq.${encodeURIComponent(id)}&user_id=eq.${encodeURIComponent(s.id)}`,{method:'DELETE'});return}
    const all=LS.get('spl_likes',{});all[id]=(all[id]||[]).filter(x=>x!==s.id);LS.set('spl_likes',all);
    LS.set('spl_likemeta',LS.get('spl_likemeta',[]).filter(m=>!(m.script_id===id&&m.user_id===s.id)));
  },
  async notifs(){
    const s=getSess();if(!s)return[];
    const mine=await DB.mine();
    const ids=mine.map(x=>x.id),titles={};
    mine.forEach(x=>titles[x.id]=x.title);
    let likes=[],coms=[],reps=[];
    if(REMOTE){
      const me=encodeURIComponent(s.id),jobs=[rq(`/rest/v1/script_comments?user_id=eq.${me}&select=id&limit=500`)];
      if(ids.length){
        const list=ids.map(encodeURIComponent).join(',');
        jobs.push(
          rq(`/rest/v1/script_likes?script_id=in.(${list})&user_id=neq.${me}&select=script_id,user_id,author,created_at&order=created_at.desc&limit=50`),
          rq(`/rest/v1/script_comments?script_id=in.(${list})&user_id=neq.${me}&select=id,script_id,user_id,author,body,created_at&order=created_at.desc&limit=50`)
        );
      }
      const res=await Promise.all(jobs),myC=res[0];
      if(ids.length){likes=res[1];coms=res[2]}
      if(myC.length)reps=await rq(`/rest/v1/script_comments?parent_id=in.(${myC.map(x=>encodeURIComponent(x.id)).join(',')})&user_id=neq.${me}&select=id,script_id,user_id,author,body,created_at&order=created_at.desc&limit=50`);
      const missing=[...new Set(reps.map(r=>r.script_id))].filter(i=>!(i in titles));
      if(missing.length){try{const t=await rq(`/rest/v1/scripts?id=in.(${missing.map(encodeURIComponent).join(',')})&select=id,title`);t.forEach(x=>titles[x.id]=x.title)}catch(e){}}
    }else{
      const cs=LS.get('spl_comments',[]),myIds=cs.filter(c=>c.user_id===s.id).map(c=>c.id);
      likes=LS.get('spl_likemeta',[]).filter(l=>ids.includes(l.script_id)&&l.user_id!==s.id);
      coms=cs.filter(c=>ids.includes(c.script_id)&&c.user_id!==s.id);
      reps=cs.filter(c=>myIds.includes(c.parent_id)&&c.user_id!==s.id);
      const all=LS.get('spl_scripts',[]);
      reps.forEach(r=>{if(!(r.script_id in titles)){const x=all.find(y=>y.id===r.script_id);if(x)titles[x.id]=x.title}});
    }
    let vm=[];
    if(REMOTE){try{vm=await rq(`/rest/v1/user_messages?user_id=eq.${encodeURIComponent(s.id)}&select=kind,body,until,created_at&order=created_at.desc&limit=20`)}catch(e){}}
    let vn=[];
    if(REMOTE){try{vn=await rq(`/rest/v1/verify_notices?user_id=eq.${encodeURIComponent(s.id)}&select=status,reason,created_at&order=created_at.desc&limit=10`)}catch(e){}}
    else vn=LS.get('spl_vnotices',[]).filter(x=>x.user_id===s.id);
    let vr=[];
    if(s.id===OWNER_ID&&REMOTE){try{vr=await rq('/rest/v1/verify_requests?status=eq.pending&select=user_id,author,created_at&order=created_at.desc&limit=30')}catch(e){}}
    let rp=[];
    if(s.id===OWNER_ID){try{rp=await Report.open()}catch(e){}}
    const rm=[...new Set(rp.map(r=>r.script_id))].filter(i=>!(i in titles));
    if(rm.length){
      try{
        if(REMOTE){const t=await rq(`/rest/v1/scripts?id=in.(${rm.map(encodeURIComponent).join(',')})&select=id,title`);t.forEach(x=>titles[x.id]=x.title)}
        else{const all=LS.get('spl_scripts',[]);rm.forEach(i=>{const x=all.find(y=>y.id===i);if(x)titles[i]=x.title})}
      }catch(e){}
    }
    const repIds=new Set(reps.map(r=>r.id));
    const out=[
      ...likes.map(l=>({type:'like',script_id:l.script_id,user_id:l.user_id,author:l.author||'Someone',created_at:l.created_at,title:titles[l.script_id]})),
      ...coms.filter(c=>!repIds.has(c.id)).map(c=>({type:'comment',script_id:c.script_id,user_id:c.user_id,author:c.author,body:c.body,created_at:c.created_at,title:titles[c.script_id]})),
      ...reps.map(c=>({type:'reply',script_id:c.script_id,user_id:c.user_id,author:c.author,body:c.body,created_at:c.created_at,title:titles[c.script_id]})),
      ...vr.map(v=>({type:'verify',script_id:'',user_id:v.user_id,author:v.author,created_at:v.created_at,title:''})),
      ...rp.map(r=>({type:'report',script_id:r.script_id,user_id:r.reporter_id,author:r.reporter,body:r.reason+(r.details?': '+r.details:''),created_at:r.created_at,title:titles[r.script_id]})),
      ...vm.map(m=>({type:m.kind,script_id:'',user_id:s.id,author:'Owner',body:m.body||'',until:m.until,created_at:m.created_at,title:''})),
      ...vn.map(v=>({type:v.status==='approved'?'verify_ok':'verify_no',script_id:'',user_id:s.id,author:'ScriptPlace',body:v.reason||'',created_at:v.created_at,title:''}))
    ];
    return out.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,30);
  },
  async comments(id){
    if(REMOTE)return rq(`/rest/v1/script_comments?script_id=eq.${encodeURIComponent(id)}&select=id,user_id,author,body,created_at,parent_id&order=created_at.desc&limit=500`);
    return LS.get('spl_comments',[]).filter(c=>c.script_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  },
  async addComment(id,body,parentId){
    const s=getSess(),pid=parentId||null;
    if(REMOTE){await Timeout.guard();const r=await rq('/rest/v1/script_comments',{method:'POST',body:{script_id:id,user_id:s.id,author:s.username,body,parent_id:pid},headers:{Prefer:'return=representation'}});return r[0]}
    const all=LS.get('spl_comments',[]);
    const n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),script_id:id,user_id:s.id,author:s.username,body,parent_id:pid,created_at:new Date().toISOString()};
    all.push(n);LS.set('spl_comments',all);return n;
  },
  async removeComment(id){
    const s=getSess();
    if(REMOTE){await rq(`/rest/v1/script_comments?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});return}

    if(all.some(c=>c.id===id&&c.user_id===s.id))LS.set('spl_comments',all.filter(c=>c.id!==id&&c.parent_id!==id));

const Badges={
  async ensure(ids){
    const need=[...new Set(ids.filter(Boolean))].filter(i=>!(i in UB));
    if(!need.length)return;
    need.forEach(i=>{UB[i]={views:0,verified:false,tag:'',tier:''}});
    if(REMOTE){
      const ok=need.filter(isUUID);if(!ok.length)return;
      const list=ok.map(encodeURIComponent).join(',');
      try{
        const [v,b]=await Promise.all([
          rq(`/rest/v1/creator_views?user_id=in.(${list})&select=user_id,total_views`),
          rq(`/rest/v1/user_badges?user_id=in.(${list})&select=user_id,verified,tag,tier`)
        ]);
        v.forEach(r=>{UB[r.user_id].views=Number(r.total_views)||0});
        b.forEach(r=>{UB[r.user_id].verified=!!r.verified;UB[r.user_id].tag=r.tag||'';UB[r.user_id].tier=r.tier||''});
      }catch(e){}
      return;
    }
    const sc=LS.get('spl_scripts',[]),bd=LS.get('spl_badges',{});
    need.forEach(i=>{
      UB[i].views=sc.filter(x=>x.user_id===i).reduce((a,x)=>a+(x.views||0),0);
      if(bd[i]){UB[i].verified=!!bd[i].verified;UB[i].tag=bd[i].tag||'';UB[i].tier=bd[i].tier||''}
    });
  },
  async save(id,verified,tag,tier){
    const t=String(tag||'').trim().slice(0,20),was=!!(UB[id]&&UB[id].verified);
    if(REMOTE){
      await rq('/rest/v1/user_badges?on_conflict=user_id',{method:'POST',body:{user_id:id,verified,tag:t||null,tier:tier||null,updated_at:new Date().toISOString()},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
    }else{
      const bd=LS.get('spl_badges',{});bd[id]={verified,tag:t,tier:tier||''};LS.set('spl_badges',bd);
    }
    UB[id]={...(UB[id]||{views:0}),verified,tag:t,tier:tier||''};
    if(verified){await Verify.clear(id);if(!was){try{await Verify.notify(id,'approved')}catch(e){}}}
  }
};
const Report={
  async send(scriptId,reason,details){
    const s=getSess(),d=String(details||'').trim().slice(0,500);
    if(REMOTE){
      try{await rq('/rest/v1/script_reports',{method:'POST',body:{script_id:scriptId,reporter_id:s.id,reporter:s.username,reason,details:d||null},headers:{Prefer:'return=minimal'}})}
      catch(e){if(/duplicate|already exists/i.test(e.message))throw new Error('You already reported this script.');throw e}
      return;
    }
    const a=LS.get('spl_reports',[]);
    if(a.some(r=>r.script_id===scriptId&&r.reporter_id===s.id))throw new Error('You already reported this script.');
    a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),script_id:scriptId,reporter_id:s.id,reporter:s.username,reason,details:d,created_at:new Date().toISOString()});
    LS.set('spl_reports',a);
  },
  async list(scriptId){
    if(REMOTE)return rq(`/rest/v1/script_reports?script_id=eq.${encodeURIComponent(scriptId)}&select=id,reporter,reason,details,created_at&order=created_at.desc&limit=50`);
    return LS.get('spl_reports',[]).filter(r=>r.script_id===scriptId).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  },
  async open(){
    if(REMOTE)return rq('/rest/v1/script_reports?select=script_id,reporter_id,reporter,reason,details,created_at&order=created_at.desc&limit=30');
    return LS.get('spl_reports',[]);
  },
  async dismiss(id){
    if(REMOTE){await rq(`/rest/v1/script_reports?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});return}
    LS.set('spl_reports',LS.get('spl_reports',[]).filter(r=>r.id!==id));
  }

const Verify={
  async status(id){
    if(REMOTE){if(!isUUID(id))return null;const r=await rq(`/rest/v1/verify_requests?user_id=eq.${encodeURIComponent(id)}&select=status,created_at`);return r[0]||null}
    return LS.get('spl_verify',{})[id]||null;
  },
  async request(){
    const s=getSess(),waitMsg='You can request again 10 minutes after a decline.';
    if(REMOTE){
      try{await rq(`/rest/v1/verify_requests?user_id=eq.${encodeURIComponent(s.id)}&status=eq.rejected`,{method:'DELETE'})}catch(e){}
      try{await rq('/rest/v1/verify_requests',{method:'POST',body:{user_id:s.id,author:s.username,status:'pending'},headers:{Prefer:'return=minimal'}})}
      catch(e){if(/duplicate|already exists/i.test(e.message))throw new Error(waitMsg);throw e}
      return;
    }
    const d=await Verify.lastDecline(s.id);
    if(d&&new Date(d.created_at).getTime()+VERIFY_WAIT>Date.now())throw new Error(waitMsg);
    const a=LS.get('spl_verify',{});a[s.id]={author:s.username,status:'pending',created_at:new Date().toISOString()};LS.set('spl_verify',a);
  },
  async decline(id,reason){
    if(REMOTE)await rq(`/rest/v1/verify_requests?user_id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:{status:'rejected'},headers:{Prefer:'return=minimal'}});
    else{const a=LS.get('spl_verify',{});if(a[id]){a[id].status='rejected';LS.set('spl_verify',a)}}
    await Verify.notify(id,'declined',reason);
  },
  async notify(id,status,reason){
    const r=String(reason||'').trim().slice(0,300);
    if(REMOTE){await rq('/rest/v1/verify_notices',{method:'POST',body:{user_id:id,status,reason:r||null},headers:{Prefer:'return=minimal'}});return}
    const a=LS.get('spl_vnotices',[]);a.push({user_id:id,status,reason:r,created_at:new Date().toISOString()});LS.set('spl_vnotices',a);
  },
  async lastDecline(id){
    if(REMOTE){if(!isUUID(id))return null;const r=await rq(`/rest/v1/verify_notices?user_id=eq.${encodeURIComponent(id)}&status=eq.declined&select=reason,created_at&order=created_at.desc&limit=1`);return r[0]||null}
    return LS.get('spl_vnotices',[]).filter(x=>x.user_id===id&&x.status==='declined').pop()||null;
  },
  async clear(id){
    try{
      if(REMOTE){await rq(`/rest/v1/verify_requests?user_id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});return}
      const a=LS.get('spl_verify',{});delete a[id];LS.set('spl_verify',a);
    }catch(e){}
  }
};

const nKey=()=>{const s=getSess();return s?'spl_nread_'+s.id:''};

const N_VERB={like:'liked',comment:'commented on',reply:'replied to you on'};
const N_ICON={like:ICON_HEART,comment:ICON_CHAT,reply:ICON_CHAT,verify:ICON_VERIFIED,verify_ok:ICON_VERIFIED,verify_no:ICON_DENY,report:ICON_FLAG,message:ICON_MAIL,timeout:ICON_CLOCK,untimeout:ICON_CLOCK};
const nHref=n=>n.type==='verify'?'#user/'+encodeURIComponent(n.user_id):['verify_ok','verify_no','message','timeout','untimeout'].includes(n.type)?'#account':'#script/'+encodeURIComponent(n.script_id);
function nText(n){
  if(n.type==='verify')return `<b>${esc(n.author)}</b> requested a verify badge`;
  if(n.type==='report')return `<b>${esc(n.author)}</b> reported <b>${esc(n.title||'a script')}</b>`;
  if(n.type==='message')return '<b>Owner</b> sent you a message';
  if(n.type==='timeout')return 'You were timed out from posting'+(n.until?' until '+esc(new Date(n.until).toLocaleString('en-US')):'')+'.';
  if(n.type==='untimeout')return 'Your timeout was removed. You can post again.';
  if(n.type==='verify_ok')return 'Your verify request was approved. You are now verified.';
  if(n.type==='verify_no')return 'Your verify request was declined.';
  return `<b>${esc(n.author)}</b> ${N_VERB[n.type]||'interacted with'} <b>${esc(n.title||'your script')}</b>`;
}
function nRender(){
  const p=$('nPanel');
  if(!getSess()){p.innerHTML='<div class="nh"><b>Notifications</b></div><div class="ne">Log in to see likes, comments and replies.</div><a class="btn" href="#account" style="display:block;margin:0 6px 6px">Login</a>';return}
  const items=notifs.map(n=>`<a class="ni${new Date(n.created_at).getTime()>nSince?' new':''}" href="${nHref(n)}"><span class="nic ${n.type}">${N_ICON[n.type]||ICON_CHAT}</span><span class="nt"><span>${nText(n)}</span>${n.body?`<span class="nq">${n.type==='verify_no'||n.type==='timeout'?'Reason: ':''}${esc(n.body.slice(0,['verify_no','report','message','timeout'].includes(n.type)?500:90))}</span>`:''}<small>${esc(timeAgo(n.created_at))}</small></span></a>`).join('');
  p.innerHTML=`<div class="nh"><b>Notifications</b></div>${items||'<div class="ne">No notifications yet. Likes, comments and replies show up here.</div>'}`;
}

function ask(title,text,label='Delete'){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='mo';
    o.innerHTML=`<div class="md" role="dialog" aria-modal="true"><div class="mic">${ICON_TRASH}</div><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="mbtn"><button type="button" class="btn sec" data-r="0">Cancel</button><button type="button" class="btn danger" data-r="1">${esc(label)}</button></div></div>`;
    const done=v=>{o.remove();res(v)};
    o.onclick=e=>{if(e.target===o)done(false)};
    o.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>done(b.dataset.r==='1'));
    document.body.appendChild(o);
    o.querySelector('[data-r="0"]').focus();
  });
}

const Msg={
  async send(id,kind,body,until){
    await rq('/rest/v1/user_messages',{method:'POST',body:{user_id:id,kind,body:String(body||'').trim().slice(0,500),until:until||null},headers:{Prefer:'return=minimal'}});
  }
};
const Timeout={
  async get(id){
    if(!REMOTE||!isUUID(id))return null;
    const r=await rq(`/rest/v1/user_timeouts?user_id=eq.${encodeURIComponent(id)}&select=until,reason`),t=r[0];
    return t&&new Date(t.until)>new Date()?t:null;
  },
  async set(id,minutes,reason){
    const until=new Date(Date.now()+minutes*60000).toISOString(),r=String(reason||'').trim().slice(0,300);
    await rq('/rest/v1/user_timeouts?on_conflict=user_id',{method:'POST',body:{user_id:id,until,reason:r||null},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
    try{await Msg.send(id,'timeout',r,until)}catch(e){}
  },
  async clear(id){
    await rq(`/rest/v1/user_timeouts?user_id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});
    try{await Msg.send(id,'untimeout','')}catch(e){}
  },
  async guard(){
    const s=getSess();if(!REMOTE||!s)return;
    let t=null;try{t=await Timeout.get(s.id)}catch(e){}
    if(t)throw new Error('You are timed out from posting until '+new Date(t.until).toLocaleString('en-US')+(t.reason?'. Reason: '+t.reason:'.'));
  }
};
function askMessage(name){
  return new Promise(res=>{

    document.body.appendChild(o);
    const done=v=>{o.remove();res(v)};
    o.onclick=e=>{if(e.target===o)done(null)};
    o.querySelector('[data-r="0"]').onclick=()=>done(null);
    o.querySelector('[data-r="1"]').onclick=()=>{const v=$('msB').value.trim();if(!v){$('msM').innerHTML='<div class="err">Please write a message.</div>';return}done(v)};

async function adClick(e){
  const t=e.target.closest('button,a');if(!t)return;
  try{
    if(t.dataset.u){
      const id=t.dataset.u;adm.open=adm.open===id?'':id;drawAdUsers();
      if(adm.open&&!adm.sc[id]){adm.sc[id]=await DB.byUser(id);if(adm.open===id)drawAdUsers()}
      return;
    }
    if(t.dataset.fill){const inp=t.closest('.ads').querySelector('.adv');inp.value=(parseInt(inp.value,10)||0)+Number(t.dataset.fill);return}
    if(t.dataset.um){const m=await askMessage(t.dataset.n);if(m===null)return;await Msg.send(t.dataset.um,'message',m);toast('Message sent');return}
    if(t.dataset.ut){
      const id=t.dataset.ut;
      if(adm.to[id]){await Timeout.clear(id);delete adm.to[id];toast('Timeout removed');drawAdUsers();return}
      const r=await askTimeout(t.dataset.n);if(!r)return;
      await Timeout.set(id,r.minutes,r.reason);
      adm.to[id]={user_id:id,until:new Date(Date.now()+r.minutes*60000).toISOString(),reason:r.reason};
      toast('User timed out');drawAdUsers();return;
    }
    if(t.dataset.bd){if(await badgeEditor(t.dataset.bd,t.dataset.n)){adm.users=await Admin.users();drawAdUsers()}return}
    if(t.dataset.add){
      const row=t.closest('.ads'),n=parseInt(row.querySelector('.adv').value,10);
      if(!n){toast('Enter a number',1);return}
      t.disabled=true;
      const sid=t.dataset.add,uid=adm.open,it=adm.sc[uid].find(x=>x.id===sid),old=Number(it.views)||0;
      const v=Number(await Admin.addViews(sid,n));
      it.views=v;const u=adm.users.find(x=>x.id===uid);if(u)u.views=Number(u.views)-old+v;
      toast('Views updated');drawAdUsers();return;
    }
    if(t.dataset.del){
      if(!await ask('Delete this script?','This permanently removes the script together with its likes and comments.'))return;
      const sid=t.dataset.del,uid=adm.open,it=adm.sc[uid].find(x=>x.id===sid);
      await DB.remove(sid);
      adm.sc[uid]=adm.sc[uid].filter(x=>x.id!==sid);
      const u=adm.users.find(x=>x.id===uid);if(u){u.scripts=Math.max(0,(u.scripts||0)-1);u.views=Math.max(0,Number(u.views)-(Number(it&&it.views)||0))}
      toast('Script deleted');drawAdUsers();return;
    }
    if(t.dataset.x!==undefined&&t.dataset.sid){
      const r=await rq(`/rest/v1/script_reports?script_id=eq.${encodeURIComponent(t.dataset.sid)}&reporter_id=eq.${encodeURIComponent(t.dataset.rp)}`,{method:'DELETE'});
      adm.reports=adm.reports.filter(x=>!(x.script_id===t.dataset.sid&&x.reporter_id===t.dataset.rp));
      toast('Report dismissed');drawAdBody();nLoad();return;
    }
  }catch(er){toast(er.message,1);if(t.disabled)t.disabled=false}
}

  $('hQ').value=home.q;

  const bindDrop=()=>{
    drop.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>applyQ(b.dataset.q));

  };
  const showExamples=()=>{
    const games=(home.top.length?home.top.map(g=>g.name):SUGG).slice(0,8);

    drop.classList.remove('hidden');
    bindDrop();
  };
  const suggest=async v=>{
    const seq=++sSeq;
    try{
      const r=await DB.list({q:v,sort:'top',page:0});
      if(seq!==sSeq||document.activeElement!==$('hQ'))return;
      const seen=new Set(),games=[];
      r.items.forEach(it=>{if(it.game_name&&!seen.has(it.game_name)&&games.length<3){seen.add(it.game_name);games.push({name:it.game_name,icon:it.icon})}});
      const items=r.items.slice(0,5);
      const thumb=u=>safeUrl(u)?`<img src="${esc(safeUrl(u))}" alt="">`:'<span class="ph"></span>';
      let html='';
      if(games.length)html+=`<div class="sl">Games</div>${games.map(g=>`<button type="button" class="sg" data-q="${esc(g.name)}">${thumb(g.icon)}<span><b>${esc(g.name)}</b><small>Show all scripts for this game</small></span></button>`).join('')}`;
      if(items.length)html+=`<div class="sl">Scripts</div>${items.map(it=>`<button type="button" class="sg" data-s="${esc(it.id)}">${thumb(it.icon)}<span><b>${esc(it.title)}</b><small>${esc(it.game_name||'Universal')}, ${fmt(it.views)} views</small></span></button>`).join('')}`;
      if(!games.length&&!items.length)html+='<div class="sl">No suggestions</div>';
      html+=`<button type="button" class="sg all" data-q="${esc(v)}">Search for "${esc(v)}"</button>`;
      drop.innerHTML=html;
      drop.classList.remove('hidden');
      bindDrop();
    }catch(e){}
  };
  $('hQ').addEventListener('focus',()=>{if(!$('hQ').value.trim())showExamples()});
  $('hQ').addEventListener('input',()=>{
    clearTimeout(sTimer);
    const v=$('hQ').value.trim();
    if(!v){showExamples();return}
    sTimer=setTimeout(()=>suggest(v),200);
  });
  const run=()=>{hideDrop();home.q=$('hQ').value.trim();syncGames();homeLoad(true)};
  $('hGo').onclick=run;$('hQ').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
  $('fsBtn').onclick=()=>{const o=$('fp').classList.toggle('hidden');$('fsBtn').classList.toggle('open',!o);$('fsBtn').setAttribute('aria-expanded',String(!o))};
  document.querySelectorAll('#sSort button').forEach(b=>b.onclick=()=>{home.sort=b.dataset.v;syncFilters();homeLoad(true)});
  document.querySelectorAll('#sKey button').forEach(b=>b.onclick=()=>{home.key=b.dataset.v;syncFilters();homeLoad(true)});
  $('fReset').onclick=()=>{home.sort='new';home.key='all';home.executor='';home.features=[];syncFilters();homeLoad(true)};
  $('hAll').onclick=()=>{home.q='';$('hQ').value='';syncGames();homeLoad(true)};
  $('hMore').onclick=()=>{home.page++;homeLoad(false)};
  if(fcount()){$('fp').classList.remove('hidden');$('fsBtn').classList.add('open');$('fsBtn').setAttribute('aria-expanded','true')}
  syncFilters();
  DB.stats().then(st=>{
    if(!$('intro'))return;
    home.top=st.top;
    $('intro').innerHTML=`<u>${fmt(st.scripts)} free Roblox scripts</u> for <u>${fmt(st.games)} games</u>, shared by the community with <u>${fmt(st.views)} total views</u> and <button class="lnk" id="kLink">${fmt(st.keyless)} keyless</button>. Open a script, copy its loadstring and run it in your executor.`;
    $('kLink').onclick=()=>{home.key='no';syncFilters();homeLoad(true)};
    renderGameChips();
  }).catch(()=>{});
  homeLoad(true);
}

async function homeLoad(reset){

  try{
    const r=await DB.list(home);await Badges.ensure(r.items.map(x=>x.user_id));home.items.push(...r.items);home.more=r.more;
    grid.innerHTML=home.items.length?home.items.map(it=>cardHTML(it)).join(''):`<div class="empty" style="grid-column:1/-1"><h3>${home.q||fcount()?'No scripts found':'No scripts yet'}</h3>${home.q||fcount()?'Try another keyword or reset the filters.':'Publish the first one.'}<div class="actions" style="justify-content:center">${fcount()?'<button class="btn sec" id="emptyReset">Reset filters</button>':'<a class="btn" href="#publish">Publish a script</a>'}</div></div>`;

}

async function initLikes(it){
  const btn=$('lkBtn');if(!btn)return;
  let liked=false,count=0,busy=false;
  const paint=()=>{const b=$('lkBtn');if(!b)return;b.classList.toggle('on',liked);b.querySelector('.n').textContent=fmt(count);b.setAttribute('aria-pressed',String(liked))};
  try{
    const l=await DB.likes(it.id),s=getSess();
    count=l.length;liked=!!s&&l.includes(s.id);
  }catch(e){}
  paint();
  btn.onclick=async()=>{
    if(!getSess()){toast('Log in to like scripts',1);return}
    if(busy)return;busy=true;
    try{
      if(liked){await DB.unlike(it.id);liked=false;count=Math.max(0,count-1)}
      else{await DB.like(it.id);liked=true;count++}
      paint();
    }catch(e){toast(e.message,1)}
    busy=false;
  };
}

async function initComments(it){
  const form=$('cmForm');if(!form)return;
  const s=getSess();
  const COOLDOWN=10*60*1000,RCOOLDOWN=60*1000;
  let list=[],profs={},posting=false,last=s?LS.get('spl_cm_'+s.id,0):0,lastR=s?LS.get('spl_rp_'+s.id,0):0;
  if(s){
    form.innerHTML=`<div class="cmform"><textarea id="cmIn" maxlength="500" placeholder="Write a comment..."></textarea><div class="cmfoot"><span class="hint" id="cmN">0 / 500</span><button type="button" class="btn" id="cmPost">Post comment</button></div><div id="cmMsg"></div></div>`;
    $('cmIn').addEventListener('input',()=>{$('cmN').textContent=$('cmIn').value.length+' / 500'});
    $('cmPost').onclick=async()=>{
      const v=$('cmIn').value.trim(),m=$('cmMsg');
      if(!v){m.innerHTML='<div class="err">Write something first.</div>';return}
      if(posting)return;
      const wait=COOLDOWN-(Date.now()-last);
      if(wait>0){m.innerHTML=`<div class="err">Cooldown active. You can comment again in ${Math.ceil(wait/60000)} min.</div>`;return}
      posting=true;$('cmPost').disabled=true;m.innerHTML='';
      try{
        const c=await DB.addComment(it.id,v);
        await Badges.ensure([c.user_id]);
        last=Date.now();
        LS.set('spl_cm_'+s.id,last);
        const cur=getSess();
        if(cur&&cur.profile)profs[cur.id]=cur.profile;
        list.unshift(c);
        $('cmIn').value='';$('cmN').textContent='0 / 500';
        draw();
      }catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`}
      posting=false;if($('cmPost'))$('cmPost').disabled=false;
    };
  }else{
    form.innerHTML='<p class="hint" style="margin:0 0 6px"><a href="#account" style="color:var(--pink);font-weight:700">Log in</a> to write a comment.</p>';
  }
  const openForm=(pid,prefill)=>{
    if(!getSess()){toast('Log in to reply',1);return}
    document.querySelectorAll('.rform').forEach(f=>{f.innerHTML=''});
    const box=$('rf-'+pid);if(!box)return;
    box.innerHTML=`<textarea maxlength="500" id="rIn" placeholder="Write a reply...">${esc(prefill)}</textarea><div class="cmfoot"><span class="hint" id="rN">${prefill.length} / 500</span><div class="rbtns"><button type="button" class="btn sec" id="rCancel">Cancel</button><button type="button" class="btn" id="rPost">Reply</button></div></div><div id="rMsg"></div>`;
    const inp=$('rIn');
    inp.addEventListener('input',()=>{$('rN').textContent=inp.value.length+' / 500'});
    $('rCancel').onclick=()=>{box.innerHTML=''};
    $('rPost').onclick=async()=>{
      const v=inp.value.trim(),m=$('rMsg');
      if(!v){m.innerHTML='<div class="err">Write something first.</div>';return}
      if(posting)return;
      const wait=RCOOLDOWN-(Date.now()-lastR);
      if(wait>0){m.innerHTML=`<div class="err">Slow down. You can reply again in ${Math.ceil(wait/1000)} s.</div>`;return}
      posting=true;$('rPost').disabled=true;m.innerHTML='';
      try{
        const c=await DB.addComment(it.id,v,pid);
        await Badges.ensure([c.user_id]);
        lastR=Date.now();
        LS.set('spl_rp_'+getSess().id,lastR);
        const cur=getSess();
        if(cur&&cur.profile)profs[cur.id]=cur.profile;
        list.push(c);
        draw();
      }catch(e){if($('rMsg'))$('rMsg').innerHTML=`<div class="err">${esc(e.message)}</div>`;if($('rPost'))$('rPost').disabled=false}
      posting=false;
    };
    inp.focus();
    inp.setSelectionRange(inp.value.length,inp.value.length);
  };
  const draw=()=>{
    const box=$('cmList');if(!box)return;
    $('cmCount').textContent=list.length;
    const tops=list.filter(c=>!c.parent_id);
    if(!tops.length){box.innerHTML='<p class="hint">No comments yet. Be the first.</p>';return}
    const kids={};
    list.filter(c=>c.parent_id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(c=>{(kids[c.parent_id]||(kids[c.parent_id]=[])).push(c)});
    const cur=getSess();
    const one=(c,top)=>{
      const reply=!!top,pid=reply?top.id:c.id,can=cur&&(cur.id===c.user_id||cur.id===OWNER_ID),k=reply?[]:(kids[c.id]||[]);
      NAMES[c.user_id]=c.author;
      return `<div class="cm${reply?' rp':''}"><a href="#user/${esc(c.user_id)}" class="ul" style="flex:0 0 auto">${avatarHTML(profs[c.user_id],c.author,reply?28:36)}</a><div class="cb"><div class="ch"><a class="ul" href="#user/${esc(c.user_id)}"><b>${esc(c.author)}</b></a>${ownerTag(c.user_id)}<small>${esc(timeAgo(c.created_at))}</small>${cur&&cur.id===OWNER_ID&&c.user_id!==OWNER_ID?`<button type="button" class="bdg" data-b="${esc(c.user_id)}" data-n="${esc(c.author)}">Badges</button>`:''}${can?`<button type="button" class="dn" data-d="${esc(c.id)}">Delete</button>`:''}</div><div class="ct">${esc(c.body)}</div><div class="cact"><button type="button" data-p="${esc(pid)}" data-n="${reply?esc(c.author):''}">Reply${k.length?` (${k.length})`:''}</button></div>${k.length?`<div class="reps">${k.map(x=>one(x,c)).join('')}</div>`:''}${reply?'':`<div class="rform" id="rf-${esc(c.id)}"></div>`}</div></div>`;
    };
    box.innerHTML=tops.map(c=>one(c,null)).join('');
    box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openForm(b.dataset.p,b.dataset.n?'@'+b.dataset.n+' ':''));
    box.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{if(await badgeEditor(b.dataset.b,b.dataset.n))pageScript(it.id)});
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.d,hasKids=list.some(x=>x.parent_id===id);
      if(!await ask('Delete this comment?',hasKids?'This comment and all replies to it will be removed for everyone.':'This comment will be removed for everyone.'))return;
      try{await DB.removeComment(id);list=list.filter(x=>x.id!==id&&x.parent_id!==id);draw();toast('Comment deleted')}catch(e){toast(e.message,1)}
    });
  };
  try{
    list=await DB.comments(it.id);
    if(!$('cmList'))return;
    draw();
    const uids=[...new Set(list.map(c=>c.user_id))],got=await Promise.all([Prof.many(uids),Badges.ensure(uids)]);
    profs=got[0];
    draw();
  }catch(e){
    if($('cmList'))$('cmList').innerHTML=`<p class="err">Could not load comments: ${esc(e.message)}</p>`;
  }
}

async function search(v){

    let list=[];

      if(!u.universeId)throw new Error('Place ID not found');

    }else{

      const games=[];(d.searchResults||[]).forEach(r=>{if(r.contentGroupType==='Game')(r.contents||[]).forEach(c=>games.push(c))});

      list=(await getJSON(`${PROXY.games}/v1/games?universeIds=${ids.join(',')}`)).data.map(map);
    }
    const ic=await icons(list.map(g=>g.universeId));
    if(seq!==searchSeq)return;
    list.forEach(g=>g.icon=ic[g.universeId]||'');
    res.innerHTML='';

      const d=document.createElement('div');d.className='game';
      d.innerHTML=`<img src="${esc(g.icon)}" alt=""><div><b>${esc(g.name)}</b><small>${fmt(g.playing)} playing, ${fmt(g.visits)} visits</small></div>`;

}

const GIF_KEEP={avatar:700*1024,banner:3*1024*1024};
const GIF_READ_MAX=30*1024*1024;
function trimGif(u8,max){
  const sig=String.fromCharCode(u8[0],u8[1],u8[2],u8[3],u8[4],u8[5]);
  if(sig!=='GIF87a'&&sig!=='GIF89a')throw new Error('This GIF file is not valid.');
  if(u8.length<=max)return{bytes:u8,cut:false};
  let p=13;
  if(u8[10]&0x80)p+=3*(1<<((u8[10]&7)+1));
  const skip=()=>{while(u8[p]!==0){p+=u8[p]+1;if(p>=u8.length)throw new Error('This GIF file is damaged.')}p++};
  let end=0,kept=0,total=0,full=false;
  while(p<u8.length){
    const b=u8[p];
    if(b===0x3b)break;
    if(b===0x21){p+=2;skip()}
    else if(b===0x2c){
      const f=u8[p+9];
      p+=10;
      if(f&0x80)p+=3*(1<<((f&7)+1));
      p++;
      skip();
      total++;
      if(!full){if(p+1<=max){kept++;end=p}else full=true}
    }else throw new Error('This GIF file is damaged.');
  }
  if(!kept)throw new Error('Even the first frame of this GIF is too large. Use a smaller GIF.');
  const out=new Uint8Array(end+1);
  out.set(u8.subarray(0,end));
  out[end]=0x3b;
  return{bytes:out,cut:kept<total,kept,total};
}

function readStatic(file,maxSide){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,maxSide/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
      const c=document.createElement('canvas');c.width=w;c.height=h;

    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read this image.'))};
    im.src=url;
  });
}
async function readImg(file,kind){
  if(!/^image\/(png|jpe?g|webp|gif)$/i.test(file.type))throw new Error('Choose a PNG, JPG, WebP or GIF image.');
  if(/^image\/gif$/i.test(file.type)){

    const r=trimGif(new Uint8Array(await file.arrayBuffer()),GIF_KEEP[kind]);
    return{src:'data:image/gif;base64,'+bytesToB64(r.bytes),note:r.cut?'GIF trimmed to the first '+r.kept+' of '+r.total+' frames to fit.':''};

function adjustImage(kind,src,tStr){

    document.body.appendChild(o);

      paintT();
    };
    const up=()=>{drag=null;F.classList.remove('drag')};
    F.onpointerup=up;F.onpointercancel=up;
    F.addEventListener('wheel',e=>{e.preventDefault();t.z=clampN(t.z*(e.deltaY<0?1.06:.94),1,4);paintT()},{passive:false});

  });

  $('loginBtn').onclick=async()=>{try{await Auth.login($('le').value.trim(),$('lp').value);try{await Prof.sync()}catch(e){}toast('Welcome back');go('home');route()}catch(e){$('lmsg').innerHTML=`<div class="err">${esc(e.message)}</div>`}};
  $('regBtn').onclick=async()=>{
    const e=$('re').value.trim(),u=$('ru').value.trim(),p=$('rp').value,m=$('rmsg');
    if(!/^\S+@\S+\.\S+$/.test(e)){m.innerHTML='<div class="err">Enter a valid email.</div>';return}
    if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){m.innerHTML='<div class="err">Invalid username.</div>';return}
    if(p.length<8){m.innerHTML='<div class="err">Password too short.</div>';return}
    try{const r=await Auth.register(e,u,p);if(r==='confirm'){m.innerHTML='<div class="good">Account created. Check your email to confirm, then log in.</div>';return}try{await Prof.sync()}catch(x){}toast('Account created');go('home');route()}catch(er){m.innerHTML=`<div class="err">${esc(er.message)}</div>`}};
}
function renderProfile(mine){
  const s=getSess(),p=s.profile||{},views=mine.reduce((a,x)=>a+(x.views||0),0);
  const since=s.created?new Date(s.created).toLocaleDateString('en-US',{month:'short',year:'numeric'}):'-';
  const work={avatar:dataImg(p.avatar),banner:dataImg(p.banner),avatar_t:fmtT(parseT(p.avatar_t)),banner_t:fmtT(parseT(p.banner_t)),color:AV_COLORS.includes(p.color)?p.color:AV_COLORS[0]};
  const plink=safeUrl(p.link);
  $('app').innerHTML=`
  <section class="prof"><div class="pban" id="pBan"></div><div class="pbody"><div id="pAv"></div>
    <div class="pinfo"><h1>${esc(s.username)}${ownerTag(s.id)}</h1><span class="hint" style="margin:0">${esc(s.email)}</span><p class="pbio" id="pBio">${esc(p.bio||'')}</p>${plink?`<a class="plink" id="pLink" href="${esc(plink)}" target="_blank" rel="noopener noreferrer">Community link</a>`:''}<div id="vrArea"></div></div>
    <div class="pstats"><div><b>${mine.length}</b><span>Scripts</span></div><div><b>${fmt(views)}</b><span>Views</span></div><div><b>${esc(since)}</b><span>Member since</span></div></div></div></section>
  <div class="grid2 eq">
    <div class="card"><h2>Edit profile</h2>
      <div class="aved"><button type="button" class="avbtn" id="upBtn" aria-label="Change photo"><span id="eAv"></span><span class="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>
        <div class="avtxt"><b>Profile photo</b><p class="hint">PNG, JPG, WebP or animated GIF. You can move and zoom it.</p><div class="avact"><button type="button" class="lnk up" id="upLink">Upload new</button><button type="button" class="lnk ad hidden" id="avAd">Adjust</button><button type="button" class="lnk dn hidden" id="rmBtn">Remove</button></div></div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"></div>
      <div class="aved" style="margin-top:14px"><div class="avtxt"><b>Profile banner</b><p class="hint">PNG, JPG, WebP or animated GIF. You can move and zoom it.</p><div class="avact"><button type="button" class="lnk up" id="bnUp">Upload banner</button><button type="button" class="lnk ad hidden" id="bnAd">Adjust</button><button type="button" class="lnk dn hidden" id="bnRm">Remove</button></div></div><input type="file" id="bnFile" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden"></div>
      <label>Accent color</label><div class="swatches" id="sw"></div>
      <label>Bio</label><textarea id="bio" maxlength="160" style="min-height:80px;font-family:inherit" placeholder="What do you make?"></textarea><div class="hint" id="bioN"></div>
      <label>Community link (https)</label><input id="plinkIn" placeholder="https://discord.gg/...">
      <div class="actions"><button class="btn" id="saveP">Save profile</button></div><div id="pmsg"></div></div>
    <div style="display:grid;gap:18px">
      ${REMOTE?'':`<div class="card"><h2>Change password</h2>
        <label>Current password</label><input type="password" id="op">
        <label>New password (min. 8 characters)</label><input type="password" id="np">
        <div class="actions"><button class="btn" id="cp">Update password</button></div><div id="msg"></div></div>`}
      <div class="card"><h2>Session</h2><div class="actions" style="margin-top:0"><button class="btn danger" id="logout">Log out</button></div></div>
    </div></div>
  <section class="mysec"><div class="rowh"><h2>Your scripts <span class="cnt">${mine.length}</span></h2><div class="rowact"><div class="seg2" id="mSort"><button data-v="new">Newest</button><button data-v="top">Most viewed</button></div><a class="btn" href="#publish" id="newBtn2">New script</a></div></div><div class="feed" id="myFeed"></div></section>`;
  $('bio').value=p.bio||'';$('plinkIn').value=p.link||'';
  const paint=()=>{
    $('pBan').setAttribute('style',bannerCSS(work,work.color));
    $('pBan').innerHTML=bannerImg(work);
    $('bnRm').classList.toggle('hidden',!work.banner);
    $('bnAd').classList.toggle('hidden',!work.banner);
    $('avAd').classList.toggle('hidden',!work.avatar);
    $('pAv').innerHTML=avatarHTML(work,s.username,88);
    $('eAv').innerHTML=avatarHTML(work,s.username,80);
    $('rmBtn').classList.toggle('hidden',!work.avatar);
    $('sw').innerHTML=AV_COLORS.map(c=>`<button type="button" class="${c===work.color?'on':''}" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('');
    $('sw').querySelectorAll('button').forEach(b=>b.onclick=()=>{work.color=b.dataset.c;paint()});
    $('bioN').textContent=$('bio').value.length+' / 160';
  };
  let bTouch=false;
  paint();
  if(!work.banner)Prof.load(s.id).then(f=>{const b=dataImg(f.banner);if(bTouch||!b)return;work.banner=b;work.banner_t=fmtT(parseT(f.banner_t));paint()}).catch(()=>{});
  $('bio').addEventListener('input',()=>{$('bioN').textContent=$('bio').value.length+' / 160';$('pBio').textContent=$('bio').value});
  $('upBtn').onclick=()=>$('file').click();
  $('upLink').onclick=()=>$('file').click();
  $('file').onchange=async()=>{
    const f=$('file').files[0];if(!f)return;
    try{
      const r=await readImg(f,'avatar'),t=await adjustImage('avatar',r.src,'50,50,1');
      if(t!==null){work.avatar=r.src;work.avatar_t=t;paint();if(r.note)toast(r.note)}
    }catch(e){toast(e.message,1)}
    $('file').value='';
  };
  $('rmBtn').onclick=()=>{work.avatar='';work.avatar_t='50,50,1';paint()};
  $('avAd').onclick=async()=>{const t=await adjustImage('avatar',work.avatar,work.avatar_t);if(t!==null){work.avatar_t=t;paint()}};
  $('bnAd').onclick=async()=>{bTouch=true;const t=await adjustImage('banner',work.banner,work.banner_t);if(t!==null){work.banner_t=t;paint()}};
  $('bnUp').onclick=()=>$('bnFile').click();
  $('bnFile').onchange=async()=>{
    const f=$('bnFile').files[0];if(!f)return;
    bTouch=true;
    try{
      const r=await readImg(f,'banner'),t=await adjustImage('banner',r.src,'50,50,1');
      if(t!==null){work.banner=r.src;work.banner_t=t;paint();if(r.note)toast(r.note)}
    }catch(e){toast(e.message,1)}
    $('bnFile').value='';
  };
  $('bnRm').onclick=()=>{bTouch=true;work.banner='';work.banner_t='50,50,1';paint()};
  $('saveP').onclick=async()=>{
    const link=$('plinkIn').value.trim(),m=$('pmsg');
    if(link&&!safeUrl(link)){m.innerHTML='<div class="err">The link must start with https://</div>';return}
    $('saveP').disabled=true;
    try{
      await Prof.save({avatar:work.avatar,avatar_t:work.avatar_t,banner:work.banner,banner_t:work.banner_t,color:work.color,bio:$('bio').value.trim().slice(0,160),link});
      m.innerHTML='';toast('Profile saved');renderProfile(mine);
    }catch(e){m.innerHTML=`<div class="err">${esc(e.message)}</div>`}
    $('saveP').disabled=false;
  };
  let mSort='new';
  const drawMine=()=>{
    document.querySelectorAll('#mSort button').forEach(b=>b.classList.toggle('on',b.dataset.v===mSort));
    const list=[...mine].sort((x,y)=>mSort==='top'?(y.views||0)-(x.views||0):new Date(y.created_at)-new Date(x.created_at)),box=$('myFeed');
    if(!list.length){box.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>Nothing published yet</h3>Your scripts will show up here.<div class="actions" style="justify-content:center"><a class="btn" href="#publish">Publish a script</a></div></div>';return}
    box.innerHTML=list.map(it=>`<div class="mc">${cardHTML({...it,author:s.username,user_id:s.id})}<div class="mcact"><button type="button" class="btn sec" data-e="${esc(it.id)}">Edit</button><button type="button" class="btn danger" data-d="${esc(it.id)}">Delete</button></div></div>`).join('');
    box.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{
      try{
        const it=await DB.get(b.dataset.e);if(!it)throw new Error('Script not found');
        draft={game:it.game_name?{name:it.game_name,placeId:it.place_id,universeId:it.universe_id,icon:it.icon}:null,features:it.features||[],title:it.title,description:it.description||'',code:it.code,link:it.link||'',access:it.paid?'paid':(it.key_system?'key':'free'),executors:it.executors||[],editId:it.id,rules:true};
        saveDraft();go('publish');
      }catch(e){toast(e.message,1)}
    });
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
      if(!await ask('Delete this script?','This permanently removes the script together with its likes and comments.'))return;
      try{await DB.remove(b.dataset.d);toast('Script deleted');pageAccount()}catch(e){toast(e.message,1)}
    });
  };
  document.querySelectorAll('#mSort button').forEach(b=>b.onclick=()=>{mSort=b.dataset.v;drawMine()});
  $('newBtn2').onclick=()=>{draft=fresh();saveDraft()};
  drawMine();
  initVerify(s.id);
  $('logout').onclick=()=>{Auth.logout();toast('Logged out');route()};
  if($('cp'))$('cp').onclick=async()=>{
    if($('np').value.length<8){$('msg').innerHTML='<div class="err">New password is too short.</div>';return}
    try{await Auth.changePassword(REMOTE?'':$('op').value,$('np').value);$('msg').innerHTML='<div class="good">Password updated.</div>'}catch(e){$('msg').innerHTML=`<div class="err">${esc(e.message)}</div>`}
  };
}
async function initVerify(id){
  const box=$('vrArea');if(!box)return;
  const u=UB[id]||{views:0,verified:false,tag:'',tier:''};
  if(u.verified){box.innerHTML='';return}
  const eff=u.tier||(tierOf(u.views)||[0,'',''])[2],ok=eff==='t3'||eff==='t4';
  let st=null;
  try{st=await Verify.status(id)}catch(e){}
  if(!$('vrArea'))return;
  if(!ok){$('vrArea').innerHTML='<p class="hint">Request Verify unlocks at Popular Creator (500K views).</p>';return}
  let note='';
  if(st&&st.status==='rejected'){
    let dr=null;
    try{dr=await Verify.lastDecline(id)}catch(e){}
    if(!$('vrArea'))return;
    const left=dr?new Date(dr.created_at).getTime()+VERIFY_WAIT-Date.now():0,why=dr&&dr.reason?' Reason: '+esc(dr.reason):'';
    if(left>0){
      $('vrArea').innerHTML='<p class="hint">Your verify request was declined.'+why+' You can request again in '+Math.ceil(left/60000)+' min.</p>';
      setTimeout(()=>{if($('vrArea'))initVerify(id)},Math.min(left,60000)+500);
      return;
    }
    note='<p class="hint">Your last verify request was declined.'+why+'</p>';
  }else if(st){$('vrArea').innerHTML='<button type="button" class="btn sec" disabled style="margin-top:12px">Verify requested</button>';return}
  $('vrArea').innerHTML=note+'<button type="button" class="btn" id="vrBtn" style="margin-top:12px">Request Verify</button><div id="vrMsg"></div>';
  $('vrBtn').onclick=async()=>{
    $('vrBtn').disabled=true;
    try{await Verify.request();toast('Verify request sent');initVerify(id)}
    catch(e){$('vrMsg').innerHTML=`<div class="err">${esc(e.message)}</div>`;$('vrBtn').disabled=false}
  };
}
async function pageUser(id){
  const s=getSess();
  if(s&&s.id===id){go('account');return}
  if(REMOTE&&!isUUID(id)){$('app').innerHTML='<div class="card empty"><h3>User not found</h3><a class="btn" href="#home">Back to scripts</a></div>';return}
  $('app').innerHTML='<div class="sk" style="height:240px"></div>';
  try{
    const adm=!!s&&s.id===OWNER_ID;
    const [p,list,,vq,tq]=await Promise.all([Prof.load(id),DB.byUser(id),Badges.ensure([id]),adm?Verify.status(id).catch(()=>null):null,adm?Timeout.get(id).catch(()=>null):null]);
    if((location.hash.slice(1).split('/')[1]||'')!==id)return;
    const name=NAMES[id]||(list[0]&&list[0].author)||p.username||'User';
    NAMES[id]=name;
    const col=AV_COLORS.includes(p.color)?p.color:AV_COLORS[0],views=list.reduce((a,x)=>a+(x.views||0),0),plink=safeUrl(p.link);
    const first=list.length?new Date(list[list.length-1].created_at).toLocaleDateString('en-US',{month:'short',year:'numeric'}):'-';
    const admin=!!s&&s.id===OWNER_ID;
    $('app').innerHTML=`<section class="prof"><div class="pban" style="${bannerCSS(p,col)}">${bannerImg(p)}</div><div class="pbody"><div id="pAv">${avatarHTML(p,name,88)}</div>
      <div class="pinfo"><h1>${esc(name)}${ownerTag(id)}</h1><p class="pbio">${esc(p.bio||'')}</p>${admin&&tq?`<p class="hint">Timed out until ${esc(new Date(tq.until).toLocaleString('en-US'))}${tq.reason?' - '+esc(tq.reason):''}</p>`:''}${plink?`<a class="plink" href="${esc(plink)}" target="_blank" rel="noopener noreferrer">Community link</a>`:''}${admin?`<div class="actions" style="margin-top:12px"><button class="btn sec" id="ubBtn">Badges</button><button class="btn sec" id="umBtn">Message</button><button class="btn sec" id="utBtn">${tq?'Remove timeout':'Timeout'}</button>${vq&&vq.status==='pending'?'<button class="btn" id="vaBtn">Approve verify</button><button class="btn danger" id="vdBtn">Decline</button>':''}</div>${vq&&vq.status==='pending'?'<p class="hint">This user requested a verify badge.</p>':''}`:''}</div>
      <div class="pstats"><div><b>${list.length}</b><span>Scripts</span></div><div><b>${fmt(views)}</b><span>Views</span></div><div><b>${esc(first)}</b><span>First script</span></div></div></div></section>
    <section class="mysec"><div class="rowh"><h2>Scripts by ${esc(name)} <span class="cnt">${list.length}</span></h2></div><div class="feed">${list.length?list.map(it=>cardHTML({...it,author:name})).join(''):'<div class="empty" style="grid-column:1/-1"><h3>No scripts yet</h3>This user has not published anything.</div>'}</div></section>`;
    if(admin)$('ubBtn').onclick=async()=>{if(await badgeEditor(id,name))pageUser(id)};
    if(admin){
      $('umBtn').onclick=async()=>{const m=await askMessage(name);if(m===null)return;try{await Msg.send(id,'message',m);toast('Message sent')}catch(e){toast(e.message,1)}};
      $('utBtn').onclick=async()=>{
        if(tq){try{await Timeout.clear(id);toast('Timeout removed');pageUser(id)}catch(e){toast(e.message,1)}return}
        const r=await askTimeout(name);if(!r)return;
        try{await Timeout.set(id,r.minutes,r.reason);toast('User timed out');pageUser(id)}catch(e){toast(e.message,1)}
      };
    }
    if($('vaBtn'))$('vaBtn').onclick=async()=>{try{await Badges.save(id,true,(UB[id]||{}).tag,(UB[id]||{}).tier);toast('User verified');pageUser(id)}catch(e){toast(e.message,1)}};
    if($('vdBtn'))$('vdBtn').onclick=async()=>{const r=await askReason(name);if(r===null)return;try{await Verify.decline(id,r);toast('Request declined');pageUser(id)}catch(e){toast(e.message,1)}};
  }catch(e){$('app').innerHTML=`<div class="card"><p class="err">${esc(e.message)}</p></div>`}
}
async function oauthReturn(){
  const qs=new URLSearchParams(location.search),hs=new URLSearchParams(location.hash.slice(1));
  const hasTok=hs.get('access_token'),errMsg=hs.get('error_description')||qs.get('error_description');
  if(!hasTok&&!errMsg)return;
  history.replaceState(null,'',location.pathname+'#home');
  if(errMsg){toast(errMsg.replace(/\+/g,' '),1);return}
  try{
    const token=hs.get('access_token'),refresh=hs.get('refresh_token');
    const r=await fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/auth/v1/user',{headers:{apikey:CFG.SUPABASE_ANON_KEY,Authorization:'Bearer '+token}});
    if(!r.ok)throw new Error('Login failed');
    const u=await r.json();
    LS.set('spl_sess',sessFrom({user:u,access_token:token,refresh_token:refresh}));
    try{await Prof.sync()}catch(e){}
    toast('Logged in');
  }catch(e){toast(e.message,1)}
}
oauthReturn().finally(route);
</script>
